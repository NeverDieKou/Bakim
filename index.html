<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>PharmaMS — Kurumsal Bakım Yönetim Sistemi</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg0:#04111f;--bg1:#071827;--bg2:#0b1f33;--bg3:#0f273f;--bg4:#13304c;
  --bd:#1a3a58;--bdl:#20486e;
  --tx:#dceaf8;--sub:#8fb8d8;--mt:#3f6e96;
  --bl:#2563eb;--bll:#4f8ef7;--bld:#1a4ab5;
  --gn:#059669;--gnl:#10b981;
  --rd:#dc2626;--rdl:#ef4444;
  --or:#d97706;--orl:#f59e0b;
  --pu:#7c3aed;--pul:#a78bfa;
  --cy:#0891b2;--cyl:#22d3ee;
}
body{background:var(--bg0);color:var(--tx);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;font-size:14px;line-height:1.5}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:var(--bg1)}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}
input,select,textarea,button{font-family:inherit}
#wrap{display:flex;flex-direction:row;min-height:100vh;overflow:hidden}
#bar{background:var(--bg1);border-bottom:1px solid var(--bdl);height:52px;display:flex;align-items:center;padding:0 20px;gap:10px;position:sticky;top:0;z-index:200;flex-shrink:0}
#nav{display:flex;flex-direction:column;gap:2px;padding:8px;flex:1}

#tr{display:flex;gap:8px;align-items:center;flex-shrink:0}
#main{flex:1;padding:24px}
.nb{background:transparent;border:1px solid transparent;border-radius:8px;padding:9px 12px;color:var(--mt);font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:9px;transition:all .15s;width:100%;text-align:left;white-space:nowrap}
.nb:hover{color:var(--sub);border-color:var(--bd)}.nb:hover{color:var(--sub);background:var(--bg3);border-color:var(--bd)}.nb.on{background:rgba(37,99,235,.15);border-color:rgba(37,99,235,.4);color:var(--bll);font-weight:700}
.nb-ico{font-size:16px;flex-shrink:0;width:20px;text-align:center}.nb-lbl{font-size:12px;flex:1}
.btn{border:none;border-radius:7px;padding:8px 16px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap;transition:opacity .15s}
.btn:hover{opacity:.85}.btn:disabled{opacity:.4;cursor:not-allowed;pointer-events:none}
.bpri{background:linear-gradient(135deg,var(--bld),var(--bl));color:#fff;box-shadow:0 2px 8px rgba(37,99,235,.3)}
.bsuc{background:linear-gradient(135deg,#047857,var(--gnl));color:#fff}
.bdng{background:transparent;color:var(--rdl);border:1px solid var(--rdl)}
.bout{background:transparent;color:var(--bll);border:1px solid var(--bl)}
.bghs{background:transparent;color:var(--mt);border:1px solid var(--bd)}
.bwrn{background:linear-gradient(135deg,var(--or),var(--orl));color:#fff}
.bpur{background:linear-gradient(135deg,var(--pu),var(--pul));color:#fff}
.bsm{padding:5px 12px;font-size:12px}.bxs{padding:3px 9px;font-size:11px}
.card{background:var(--bg2);border:1px solid var(--bdl);border-radius:12px;padding:20px;margin-bottom:18px}
.cardt{font-size:11px;font-weight:700;color:var(--mt);letter-spacing:1.4px;text-transform:uppercase;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.inp{background:var(--bg0);border:1px solid var(--bdl);border-radius:7px;padding:8px 12px;color:var(--tx);font-size:13px;width:100%;outline:none;transition:border-color .15s}
.inp:focus{border-color:var(--bl);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
.isml{padding:6px 10px;font-size:12px}
textarea.inp{resize:vertical;min-height:70px}
.lbl{font-size:11px;color:var(--mt);letter-spacing:.8px;text-transform:uppercase;font-weight:700;margin-bottom:5px;display:block}
.fr{margin-bottom:14px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.86);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px}
.md{background:var(--bg2);border:1px solid var(--bdl);border-radius:14px;padding:28px;width:100%;max-width:600px;max-height:94vh;overflow-y:auto}
.mdlg{max-width:860px}
.mdh{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;padding-bottom:16px;border-bottom:1px solid var(--bd)}
.mdt{font-size:17px;font-weight:800}.mdc{background:none;border:none;color:var(--mt);font-size:22px;line-height:1;cursor:pointer}.mdc:hover{color:var(--tx)}
.tabs{display:flex;border-bottom:1px solid var(--bd);margin-bottom:18px}
.tabb{background:transparent;border:none;border-bottom:2px solid transparent;padding:9px 16px;font-size:13px;font-weight:500;color:var(--mt);cursor:pointer;white-space:nowrap}
.tabb.on{border-bottom-color:var(--bll);color:var(--bll);font-weight:700}
.badge{padding:3px 9px;border-radius:5px;font-size:11px;font-weight:700;border:1px solid;display:inline-flex;align-items:center;gap:3px}
.bxsm{padding:1px 6px;font-size:10px}
.led{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:10px;color:var(--mt);letter-spacing:1px;text-transform:uppercase;font-weight:700;padding:8px 10px;text-align:left;border-bottom:1px solid var(--bdl);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--bg3);font-size:12px;vertical-align:middle}
.tbl tbody tr:hover td{background:var(--bg3);cursor:pointer}
.sc{background:var(--bg2);border-radius:12px;padding:16px 20px;position:relative;overflow:hidden;border:1px solid var(--bdl)}
.sa{position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:4px 0 0 4px}
.sv{font-size:32px;font-weight:900;line-height:1;margin-bottom:4px}.sl{font-size:10px;color:var(--mt);letter-spacing:1.2px;text-transform:uppercase;font-weight:600}
.tlw{position:relative;padding-left:28px}.tlw::before{content:'';position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--bd)}
.tli{position:relative;margin-bottom:18px}
.tld{position:absolute;left:-24px;top:4px;width:14px;height:14px;border-radius:50%;border:2px solid var(--bg2)}
.tlb{background:var(--bg3);border:1px solid var(--bd);border-radius:9px;padding:12px 15px}
#lgw{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg0);padding:20px}
.lgb{background:var(--bg2);border:1px solid var(--bdl);border-radius:16px;padding:32px 28px;width:100%;max-width:440px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#toast{position:fixed;bottom:24px;right:24px;border-radius:9px;padding:11px 20px;font-size:13px;font-weight:600;z-index:9999;box-shadow:0 4px 24px rgba(0,0,0,.5);display:none;align-items:center;gap:8px;max-width:360px}
.alert{border-radius:9px;padding:12px 16px;margin-bottom:16px;display:flex;align-items:flex-start;gap:10px;font-size:13px}
.irow{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--bg3);border-radius:8px;margin-bottom:8px;font-size:13px}
.chkr{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;padding:4px 0}
.chkr input[type=checkbox]{width:15px;height:15px;cursor:pointer;accent-color:var(--gnl)}
.empty{text-align:center;padding:40px 20px;color:var(--mt)}
.pbar{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;margin-top:4px}
.pfil{height:100%;border-radius:3px}

/* ═══ MOBILE RESPONSIVE ═══ */

#sidebar{width:220px;min-width:220px;flex-shrink:0;background:var(--bg1);border-right:1px solid var(--bdl);display:flex;flex-direction:column;height:100vh;position:sticky;top:0;overflow-y:auto;z-index:300}
#sidebar::-webkit-scrollbar{width:4px}#sidebar::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px}
#sidebar-top{padding:16px 12px 12px;border-bottom:1px solid var(--bdl);flex-shrink:0}
#sidebar-bottom{padding:10px;border-top:1px solid var(--bdl);flex-shrink:0;margin-top:auto}
#content-area{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
#tr{display:flex;gap:8px;align-items:center;margin-left:auto;flex-shrink:0}

@media(max-width:700px){
  #sidebar{display:none}
  #content-area{flex:1}
  #bar{padding:0 12px;height:50px;gap:8px}
  #main{padding:14px}
  .g2,.g3{grid-template-columns:1fr}
  .tbl thead{display:none}
  .tbl tr{display:block;margin-bottom:10px;border:1px solid var(--bdl);border-radius:9px;padding:10px}
  .tbl td{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border:none;font-size:12px}
  .tbl td:before{content:attr(data-label);font-size:10px;color:var(--mt);font-weight:700;text-transform:uppercase;letter-spacing:.6px;flex-shrink:0;margin-right:8px}
  .md{padding:18px;max-height:96vh;border-radius:12px}
  .mdlg{max-width:100%}
  .tabs .tabb{padding:7px 10px;font-size:12px}
  .btn{font-size:12px;padding:7px 12px}
  .bsm{padding:5px 10px;font-size:11px}
  .bxs{padding:3px 7px;font-size:10px}
  /* Mobile nav bottom bar */
  #mob-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--bg1);border-top:1px solid var(--bdl);z-index:250;padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
  #mob-nav button{flex:1;background:transparent;border:none;color:var(--mt);font-size:10px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px}
  #mob-nav button .mi{font-size:18px}
  #mob-nav button.on{color:var(--bll)}
  #main{padding-bottom:72px}
  /* QR mobile page */
  .qr-mob-page{min-height:100vh;background:var(--bg0);padding:16px;padding-bottom:80px}
  .qr-eq-card{background:var(--bg2);border:1px solid var(--bdl);border-radius:14px;padding:18px;margin-bottom:14px}
  .qr-stat-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
  .qr-stat{background:var(--bg3);border-radius:9px;padding:12px;text-align:center}
  .qr-stat-v{font-size:24px;font-weight:900;line-height:1}
  .qr-stat-l{font-size:10px;color:var(--mt);text-transform:uppercase;letter-spacing:.8px;margin-top:3px}
}
@media(min-width:701px){
  #mob-nav{display:none}
}
/* QR landing page (any screen) */
#qr-landing{min-height:100vh;background:var(--bg0);display:flex;flex-direction:column}
.qr-top{background:var(--bg1);border-bottom:1px solid var(--bdl);padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:200}
.qr-body{flex:1;padding:16px;max-width:600px;margin:0 auto;width:100%;padding-bottom:80px}


/* QR Scanner Modal */
#qr-scanner-ov{position:fixed;inset:0;background:#000;z-index:600;display:flex;flex-direction:column}
#qr-scanner-bar{background:rgba(0,0,0,.7);padding:14px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0}
#qr-video-wrap{position:relative;flex:1;overflow:hidden;display:flex;align-items:center;justify-content:center}
#qr-video{width:100%;height:100%;object-fit:cover}
#qr-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.qr-frame{width:220px;height:220px;position:relative}
.qr-frame::before,.qr-frame::after{content:'';position:absolute;width:40px;height:40px;border-color:#22d3ee;border-style:solid}
.qr-frame::before{top:0;left:0;border-width:3px 0 0 3px;border-radius:4px 0 0 0}
.qr-frame::after{bottom:0;right:0;border-width:0 3px 3px 0;border-radius:0 0 4px 0}
.qr-corner-tr{position:absolute;top:0;right:0;width:40px;height:40px;border-top:3px solid #22d3ee;border-right:3px solid #22d3ee;border-radius:0 4px 0 0}
.qr-corner-bl{position:absolute;bottom:0;left:0;width:40px;height:40px;border-bottom:3px solid #22d3ee;border-left:3px solid #22d3ee;border-radius:0 0 0 4px}
.qr-scan-line{position:absolute;left:10px;right:10px;height:2px;background:linear-gradient(90deg,transparent,#22d3ee,transparent);animation:scan 2s ease-in-out infinite}
@keyframes scan{0%{top:10px}100%{top:200px}}
#qr-status{position:absolute;bottom:30px;left:0;right:0;text-align:center;font-size:13px;font-weight:600;color:#fff;background:rgba(0,0,0,.5);padding:8px;margin:0 20px;border-radius:8px}

</style>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

var FB_CONFIG = {
  databaseURL: 'https://huseyinbakim-default-rtdb.europe-west1.firebasedatabase.app'
};
var FB_APP = null;
var FB_DB  = null;
var FB_REF = null;
var FB_CONNECTED = false;
var FB_SAVE_TIMER = null;

function fbInit() {
  try {
    FB_APP = firebase.initializeApp(FB_CONFIG);
    FB_DB  = firebase.database();
    FB_REF = FB_DB.ref('pharma_ms_data');

    // Bağlantı durumunu izle
    FB_DB.ref('.info/connected').on('value', function(snap) {
      FB_CONNECTED = snap.val() === true;
      showSyncStatus(FB_CONNECTED ? 'connected' : 'offline');
    });

    // Realtime listener — başka cihazdan değişiklik gelince güncelle
    FB_REF.on('value', function(snap) {
      var data = snap.val();
      if(!data) {
        // Firebase boş — yerel veriyi yükle ve kaydet
        fbSaveNow();
        return;
      }
      // Gelen veriyi uygula
      var needRender = false;
      var keys = ['workOrders','equipment','technicians','users','eqDocs','settings','schedule','kvalData','kvalSteps','logs','spareParts','spareMovements','eqPartHistory','spareCats','waterPlans','waterStatuses'];
      keys.forEach(function(k) {
        if(data[k] !== undefined) {
          // Array olarak gelenleri düzelt
          if(k === 'workOrders' || k === 'equipment' || k === 'technicians' || k === 'users' || k === 'schedule') {
            DB[k] = Array.isArray(data[k]) ? data[k] : Object.values(data[k] || {});
          } else {
            DB[k] = data[k];
          }
          needRender = true;
        }
      });
      if(needRender && U) {
        // Sayfayı yeniden render et (modal açıksa dokunma)
        var hasModal = Object.values(MODAL).some(function(v){return v;});
        if(!hasModal && !QR_ACTIVE && !(qrReadTarget&&qrReadTarget())) renderPage();
      }
      // Firebase veri yüklenince pending SP/QR kontrolü
      if(U) {
        var psp = window._pendingSP || sessionStorage.getItem('pendingSP');
        if(psp) {
          window._pendingSP = null;
          sessionStorage.removeItem('pendingSP');
          var spFound = (DB.spareParts||[]).find(function(x){return x.id===psp;});
          if(spFound) {
            setTimeout(function(){ showSpareQRLanding(psp); }, 100);
          }
        }
        var pqr = window._pendingQR || sessionStorage.getItem('pendingQR') || (qrReadTarget&&qrReadTarget()&&qrReadTarget().eq);
        if(pqr) {
          var eqIdNorm = (typeof normalizeQREqId === 'function') ? normalizeQREqId(pqr) : pqr;
          var ptab = sessionStorage.getItem('pendingQRTab') || QR_PENDING_TAB || 'workorders';
          var eqFound = (DB.equipment||[]).find(function(x){return String(x.id).toUpperCase()===eqIdNorm;});
          if(eqFound) {
            window._pendingQR = null;
            sessionStorage.removeItem('pendingQR');
            sessionStorage.removeItem('pendingQRTab');
            setTimeout(function(){ showQRLanding(eqFound.id, ptab); }, 100);
          }
        }
      }
      // localStorage'a da kaydet (offline fallback)
      try { localStorage.setItem(SK, JSON.stringify(DB)); } catch(e) {}
    }, function(err) {
      console.warn('Firebase okuma hatası:', err.message);
      showSyncStatus('error');
    });

  } catch(e) {
    console.warn('Firebase başlatılamadı:', e.message);
    FB_CONNECTED = false;
  }
}

function fbSave() {
  // Debounce — 800ms bekle, çok sık kaydetme
  clearTimeout(FB_SAVE_TIMER);
  FB_SAVE_TIMER = setTimeout(fbSaveNow, 800);
}

function fbSaveNow() {
  if(!FB_REF) return;
  var payload = {
    workOrders:   DB.workOrders   || [],
    equipment:    DB.equipment    || [],
    technicians:  DB.technicians  || [],
    users: (DB.users||[]).map(function(u){
      // pw alanını garanti et
      if(!u.pw&&u.password) u.pw=u.password;
      return u;
    }),
    eqDocs:       DB.eqDocs       || {},
    settings:     DB.settings     || {},

    kvalData:     DB.kvalData     || {},

function showSyncStatus(status) {

  if(!el) return;
  var icons = {
    connected: {ico:'☁', col:'var(--gnl)', txt:'Senkronize'},
    saved:     {ico:'✓', col:'var(--gnl)', txt:'Kaydedildi'},
    offline:   {ico:'⚡', col:'var(--orl)', txt:'Çevrimdışı'},
    saving:    {ico:'↑', col:'var(--bll)', txt:'Kaydediyor...'},
    error:     {ico:'⚠', col:'var(--rdl)', txt:'Hata'},
  };
  var s = icons[status] || icons.offline;

}

function R(){
  var app=document.getElementById('app');
  if(!U){
    app.innerHTML=tplLogin();
    bindLogin();
    // Eğer QR parametresi varsa login sayfasında ipucu göster
    if(window._pendingSP||window._pendingQR||sessionStorage.getItem('pendingQR')||sessionStorage.getItem('pendingSP')){
      var hint=document.createElement('div');
      hint.style.cssText='text-align:center;padding:10px;font-size:12px;color:var(--bll);background:rgba(37,99,235,.1);border-radius:8px;margin-top:10px;border:1px solid rgba(37,99,235,.3)';
      hint.innerHTML='📱 QR kodu algılandı. Giriş yaptıktan sonra ilgili ekipman veya yedek parça ekranı açılacak.';
      var lgb=document.querySelector('.lgb');
      if(lgb)lgb.appendChild(hint);
    }
    return;
  }

  // Giriş yapılmışsa QR isteğini ana sayfaya düşürmeden işle.
  qrCaptureTarget();
  if(qrForceOpenTarget && qrForceOpenTarget()) return;
  // Firebase verisi daha önce yüklenmiş olsa bile login sonrası tekrar denenir.
  if(hasPendingQR()){
    if(consumePendingQR && consumePendingQR()) return;
    showPendingRedirect('Ekipman iş emirleri açılıyor');
    setTimeout(function(){
      if(consumePendingQR && consumePendingQR()) return;
      var raw = window._pendingQR || sessionStorage.getItem('pendingQR');
      var eqId = (typeof normalizeQREqId==='function') ? normalizeQREqId(raw) : raw;
      qrClearTarget();
      showQRLanding(eqId, 'workorders');
    }, 1200);
    return;
  }

  QR_ACTIVE=false;
  app.innerHTML=tplShell();bindNav();renderPage();renderModals();
}

}

function bindLogin(){
  // Hatırlanan kullanıcıyı yükle
  try{
    var rem=localStorage.getItem('pharma_remember');
    if(rem){var rd=JSON.parse(rem);
      var lu=document.getElementById('l-u');var lp=document.getElementById('l-p');var lr=document.getElementById('l-rem');
      if(lu)lu.value=rd.u||'';if(lp)lp.value=rd.p||'';if(lr)lr.checked=true;
    }
  }catch(e){}
  function doLogin(){
    var u=(document.getElementById('l-u')||{value:''}).value.trim();
    var p=(document.getElementById('l-p')||{value:''}).value;
    var rem=(document.getElementById('l-rem')||{checked:false}).checked;
    var f=DB.users.find(function(x){return x.un===u&&(x.pw===p||x.password===p)&&x.active;});
    if(f){
      // Beni hatırla
      try{
        if(rem)localStorage.setItem('pharma_remember',JSON.stringify({u:u,p:p}));
        else localStorage.removeItem('pharma_remember');
      }catch(e){}
      U=f;
      addLog('Giriş','Kullanıcı girişi yapıldı','','');
      // URL ile gelen QR parametresini login sonrası tekrar garanti altına al
      try{
        var up = new URLSearchParams(window.location.search);
        var qe = up.get('eq');
        var qt = up.get('tab') || up.get('page');
        if(qe){
          window._pendingQR = qe;
          sessionStorage.setItem('pendingQR', qe);
          sessionStorage.setItem('pendingQRTab', (qt==='new_wo'||qt==='new'?'new_wo':'workorders'));
        }
      }catch(e){}
      // Hash QR kontrolü
      var h=window.location.hash;
      if(h&&h.startsWith('#qr=')){
        var eid=h.replace('#qr=','').split(':')[0];
        window.location.hash='';
        sessionStorage.setItem('pendingQR',eid);
        sessionStorage.setItem('pendingQRTab','workorders');
        window._pendingQR=eid;
      }
      // QR ile gelindiyse ana sayfaya değil doğrudan ekipman İş Emirleri ekranına git
      qrCaptureTarget();
      if(qrForceOpenTarget && qrForceOpenTarget()) return;
      if(openQRWorkorderAfterLogin && openQRWorkorderAfterLogin()) return;
      R();
    }
    else{var err=document.getElementById('l-err');if(err)err.style.display='block';}
  }
  var btn=document.getElementById('l-btn');if(btn)btn.onclick=doLogin;
  var lp=document.getElementById('l-p');if(lp)lp.onkeydown=function(e){if(e.key==='Enter')doLogin();};
  var lu=document.getElementById('l-u');if(lu)lu.onkeydown=function(e){if(e.key==='Enter'&&lp)lp.focus();};
}

function bindNav(){
  document.querySelectorAll('.nb[data-p]').forEach(function(b){b.onclick=function(){PAGE=b.dataset.p;R();};});
  var lb=document.getElementById('b-logout');if(lb)lb.onclick=function(){addLog('Çıkış','Oturum kapatıldı','','');dbSave();U=null;R();};
  // Mobile nav active state
  ['dashboard','workorders','equipment','schedule','reports'].forEach(function(p){
    var mb=document.getElementById('mn-'+p);
    if(mb){mb.className=PAGE===p?'on':'';}
  });
}

function pgDash(){
  var s=DB.settings,wos=DB.workOrders,eqs=DB.equipment;
  var mon=today().slice(0,7);
  var urgent=eqs.filter(function(e){var d=daysLeft(e.nextMaint);return d!==null&&d<=s.critDays&&d>=0;});
  var warn2=eqs.filter(function(e){var d=daysLeft(e.nextMaint);return d!==null&&d<=s.warnDays&&d>s.critDays;});
  var stats=[
    {lbl:'Açık İş Emirleri',v:wos.filter(function(w){return w.status==='acik';}).length,col:'var(--rdl)'},
    {lbl:'Devam Ediyor',v:wos.filter(function(w){return w.status==='devam';}).length,col:'var(--orl)'},
    {lbl:'Onay Bekliyor',v:wos.filter(function(w){return w.status==='bekliyor';}).length,col:'var(--pul)'},
    {lbl:'Bu Ay Kapatılan',v:wos.filter(function(w){return w.status==='kapali'&&w.closedAt&&w.closedAt.startsWith(mon);}).length,col:'var(--gnl)'},
    {lbl:'GMP Etkili Açık',v:wos.filter(function(w){return w.gmp&&w.status!=='kapali';}).length,col:'var(--cyl)'},
    {lbl:'Arızalı Ekipman',v:eqs.filter(function(e){return e.status==='arizali';}).length,col:'var(--rdl)'},
    {lbl:'Toplam İş Emri',v:wos.length,col:'var(--bll)'},
    {lbl:'Toplam Ekipman',v:eqs.length,col:'var(--sub)'},
  ];
  var scH=function(arr){return arr.map(function(s){return'<div class="sc" style="border-color:'+s.col+'25"><div class="sa" style="background:'+s.col+'"></div><div class="sv" style="color:'+s.col+'">'+s.v+'</div><div class="sl">'+s.lbl+'</div></div>';}).join('');};
  var alertH='';
  if(urgent.length||warn2.length){alertH='<div class="alert" style="background:rgba(220,38,38,.08);border:1px solid rgba(220,38,38,.25)"><span style="font-size:20px;flex-shrink:0">'+(urgent.length?'🔴':'🟡')+'</span><div>'+(urgent.length?'<div style="font-weight:700;color:var(--rdl)">Kritik Bakım: '+urgent.map(function(e){return esc(e.name);}).join(', ')+'</div>':'')+(warn2.length?'<div style="color:var(--orl)">Yaklaşan: '+warn2.map(function(e){return esc(e.name);}).join(', ')+'</div>':'')+'</div></div>';}
  var recent=[].concat(wos).sort(function(a,b){return b.date.localeCompare(a.date);}).slice(0,8);
  var recentH=recent.length===0?emptyHTML('Henüz iş emri yok'):recent.map(function(w){var eq=eqs.find(function(e){return e.id===w.eqId;});var tc=DB.technicians.find(function(t){return t.id===w.techId;});var wt=WTYPES[w.type]||{ico:'?'};return'<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd);cursor:pointer" onclick="openWODet(\''+w.id+'\')"><span style="font-size:18px;flex-shrink:0">'+wt.ico+'</span><div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(w.title)+'</div><div style="font-size:11px;color:var(--mt)">'+esc((eq&&eq.name)||'—')+' · '+esc((tc&&tc.name)||'—')+' · '+esc(w.date)+'</div></div><div style="display:flex;gap:5px;flex-shrink:0">'+sevBadge(w.sev,true)+' '+staBadge(w.status,true)+'</div></div>';}).join('');
  var eqH=eqs.map(function(e){return'<div style="display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--bd);cursor:pointer" onclick="openEqDet(\''+e.id+'\')"><div><div style="font-size:12px;font-weight:600">'+esc(e.name)+'</div><div style="font-size:10px;color:var(--mt)">'+esc(e.area)+'</div></div>'+eqLed(e.status)+'</div>';}).join('');
  return '<div style="font-size:20px;font-weight:800;margin-bottom:20px;letter-spacing:-.3px">Gösterge Paneli</div>'+alertH+'<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px">'+scH(stats.slice(0,4))+'</div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px">'+scH(stats.slice(4))+'</div><div style="display:grid;grid-template-columns:3fr 2fr;gap:18px;margin-bottom:18px"><div class="card"><div class="cardt">Son İş Emirleri <button class="btn bghs bxs" onclick="PAGE=\'workorders\';R()">Tümü →</button></div>'+recentH+'</div><div class="card"><div class="cardt">Ekipman Durumu <button class="btn bghs bxs" onclick="PAGE=\'equipment\';R()">Tümü →</button></div>'+eqH+'</div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:18px"><div class="card"><div class="cardt">Aylık İş Emri Trendi</div><canvas id="ch-trend" height="200"></canvas></div><div class="card"><div class="cardt">Ekipman Bazlı Dağılım</div><canvas id="ch-eq" height="200"></canvas></div></div>';
}

function filtWOs(){
  return DB.workOrders.filter(function(w){
    if(FLT.type!=='all'&&w.type!==FLT.type)return false;
    if(FLT.sev!=='all'&&w.sev!==FLT.sev)return false;
    if(FLT.status!=='all'&&w.status!==FLT.status)return false;
    if(FLT.q){var q=FLT.q.toLowerCase();var eq=DB.equipment.find(function(e){return e.id===w.eqId;});if(w.title.toLowerCase().indexOf(q)<0&&((eq&&eq.name)||'').toLowerCase().indexOf(q)<0&&w.id.toLowerCase().indexOf(q)<0)return false;}
    return true;
  });
}

}

// QR ENGINE
function makeQR(text,cell){
  cell=cell||8;
  var bytes=[];for(var i=0;i<text.length;i++){var c=text.charCodeAt(i);bytes.push(c<128?c:63);}
  var caps=[0,16,28,44,64,86,108,124,154,182,216];
  var ver=1;for(var i=1;i<caps.length;i++){if(bytes.length<=caps[i]){ver=i;break;}}
  var sz=17+4*ver;
  var M=[];for(var i=0;i<sz;i++){M.push(new Int8Array(sz).fill(-1));}
  function finder(r,c){for(var i=0;i<=6;i++)for(var j=0;j<=6;j++)M[r+i][c+j]=((i===0||i===6||j===0||j===6)||(i>=2&&i<=4&&j>=2&&j<=4))?1:0;}
  finder(0,0);finder(0,sz-7);finder(sz-7,0);
  for(var i=0;i<8;i++){[7,sz-8].forEach(function(p){if(M[p]&&M[p][i]<0)M[p][i]=0;if(M[i]&&M[i][p]<0)M[i][p]=0;});if(M[7]&&M[7][sz-8+i]<0)M[7][sz-8+i]=0;if(M[sz-8]&&M[sz-8][i]<0)M[sz-8][i]=0;}
  for(var i=8;i<sz-8;i++){if(M[6][i]<0)M[6][i]=i%2===0?1:0;if(M[i][6]<0)M[i][6]=i%2===0?1:0;}
  M[sz-8][8]=1;
  for(var i=0;i<=8;i++){if(M[8][i]<0)M[8][i]=0;if(M[i][8]<0)M[i][8]=0;}
  for(var i=0;i<=7;i++){if(M[8][sz-1-i]<0)M[8][sz-1-i]=0;if(M[sz-1-i][8]<0)M[sz-1-i][8]=0;}
  var bits=[];function addB(val,n){for(var i=n-1;i>=0;i--)bits.push((val>>i)&1);}
  addB(4,4);addB(bytes.length,8);bytes.forEach(function(b){addB(b,8);});addB(0,4);while(bits.length%8)bits.push(0);
  var pad=[236,17],pi=0,dcap=[0,16,28,44,64,86,108,124,154,182,216];
  while(bits.length<dcap[ver]*8){addB(pad[pi%2],8);pi++;}
  var gexp=new Uint8Array(512),glog=new Uint8Array(256);
  (function(){var x=1;for(var i=0;i<255;i++){gexp[i]=x;glog[x]=i;x<<=1;if(x&256)x^=285;}for(var i=255;i<512;i++)gexp[i]=gexp[i-255];})();
  function gm(a,b){return(a&&b)?gexp[(glog[a]+glog[b])%255]:0;}
  function gpMul(p,q){var r=new Uint8Array(p.length+q.length-1);for(var i=0;i<p.length;i++)for(var j=0;j<q.length;j++)r[i+j]^=gm(p[i],q[j]);return r;}
  function gpDiv(num,den){var r=new Uint8Array(num);for(var i=0;i<num.length-den.length+1;i++){var cv=r[i];if(!cv)continue;for(var j=1;j<den.length;j++)if(den[j])r[i+j]^=gm(den[j],cv);}return r.slice(num.length-den.length+1);}
  function gen(n){var g=[1];for(var i=0;i<n;i++)g=gpMul(g,[1,gexp[i]]);return g;}
  var ecn=[0,10,16,26,18,24,16,18,22,22,26];
  var data=[];for(var i=0;i<bits.length;i+=8){var b=0;for(var j=0;j<8;j++)b=(b<<1)|(bits[i+j]||0);data.push(b);}
  var ec=Array.from(gpDiv(new Uint8Array(data.concat(new Array(ecn[ver]).fill(0))),gen(ecn[ver])));
  var all=data.concat(ec);
  var mBits=[];all.forEach(function(b){for(var i=7;i>=0;i--)mBits.push((b>>i)&1);});mBits.push(0);
  var bi=0,up=true;
  for(var c=sz-1;c>=1;c-=2){if(c===6)c=5;for(var rr=0;rr<sz;rr++){var r=up?sz-1-rr:rr;for(var dc=0;dc<2;dc++){var col=c-dc;if(M[r][col]<0){M[r][col]=mBits[bi]||0;bi++;}}}up=!up;}
  for(var r=0;r<sz;r++)for(var c=0;c<sz;c++){if(M[r][c]<2&&M[r][c]>=0&&(r+c)%2===0)M[r][c]^=1;}
  var fs=0x5412,fb=[];for(var i=14;i>=0;i--)fb.push((fs>>i)&1);
  var fseq=[0,1,2,3,4,5,7,8];for(var i=0;i<8;i++){M[8][fseq[i]]=fb[i];M[fseq[i]][8]=fb[i];}
  for(var i=0;i<7;i++)M[sz-1-i][8]=fb[i];for(var i=0;i<8;i++)M[8][sz-8+i]=fb[14-i];M[sz-8][8]=1;
  var q=3,tot=(sz+q*2)*cell;
  var cvs=document.createElement('canvas');cvs.width=tot;cvs.height=tot;
  var ctx=cvs.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,tot,tot);ctx.fillStyle='#000';
  for(var r=0;r<sz;r++)for(var c=0;c<sz;c++)if(M[r][c]===1)ctx.fillRect((c+q)*cell,(r+q)*cell,cell,cell);
  return cvs;
}
function drawQR(eqId){
  var eq=DB.equipment.find(function(e){return e.id===eqId;});
  if(!eq)return;
  var el=document.getElementById('qr-disp');
  if(!el)return;
  el.innerHTML='';
  var url=BASE_URL+'?eq='+eq.id+'&tab=workorders';
  // QRCode.js kütüphanesi — telefon kamerası %100 okur
  var div=document.createElement('div');
  el.appendChild(div);
  try{
    new QRCode(div,{
      text:url,
      width:260,
      height:260,
      colorDark:'#000000',
      colorLight:'#ffffff',
      correctLevel:QRCode.CorrectLevel.M
    });
  }catch(err){
    el.innerHTML='<div style="color:red;padding:8px;font-size:11px">QR hatası: '+esc(err.message)+'</div>';

function generatePPTX() {
  if(typeof PptxGenJS === 'undefined') {
    toast('PowerPoint kütüphanesi yükleniyor, lütfen bekleyin...','warn');
    return;
  }

  var now = new Date();
  var monthNames = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
  var raporAy = monthNames[now.getMonth()];
  var raporYil = now.getFullYear();

  // Son 30 günü filtrele
  var cutoff = new Date(); cutoff.setDate(cutoff.getDate()-30);
  var cutoffStr = cutoff.toISOString().slice(0,10);
  var ayWOs = DB.workOrders.filter(function(w){ return w.date >= cutoffStr; });
  var tumWOs = DB.workOrders;

  // İstatistikler
  var totalWO = ayWOs.length;
  var openWO = ayWOs.filter(function(w){return w.status==='acik';}).length;
  var closedWO = ayWOs.filter(function(w){return w.status==='kapali';}).length;
  var devamWO = ayWOs.filter(function(w){return w.status==='devam';}).length;
  var gmpWO = ayWOs.filter(function(w){return w.gmp;}).length;
  var kritikWO = ayWOs.filter(function(w){return w.sev==='kritik';}).length;
  var totalLH = ayWOs.reduce(function(s,w){return s+(parseFloat(w.lh)||0);},0);
  var totalPC = ayWOs.reduce(function(s,w){return s+(parseFloat(w.pc)||0);},0);
  var compRate = totalWO > 0 ? Math.round(closedWO/totalWO*100) : 0;

  // MTTR
  var mttrArr = ayWOs.filter(function(w){return w.status==='kapali'&&w.type==='ariza'&&w.closedAt&&w.date;});
  var mttr = mttrArr.length ? (mttrArr.reduce(function(s,w){return s+(new Date(w.closedAt)-new Date(w.date))/3600000;},0)/mttrArr.length).toFixed(1) : 'N/A';

  // İş tipi dağılımı
  var typeCount = {};
  ayWOs.forEach(function(w){ typeCount[w.type]=(typeCount[w.type]||0)+1; });

  // Ekipman durumu
  var aktif = DB.equipment.filter(function(e){return e.status==='aktif';}).length;
  var arizali = DB.equipment.filter(function(e){return e.status==='arizali';}).length;
  var bakimda = DB.equipment.filter(function(e){return e.status==='bakimda';}).length;

  // GMP açık iş emirleri
  var gmpAcik = ayWOs.filter(function(w){return w.gmp&&w.status!=='kapali';});

  // Teknisyen performansı (son 30 gün)
  var techPerf = DB.technicians.filter(function(t){return t.active;}).map(function(t){
    var twos = ayWOs.filter(function(w){return w.techId===t.id;});
    var tclosed = twos.filter(function(w){return w.status==='kapali';}).length;
    return {name:t.name, role:t.role, total:twos.length, closed:tclosed, lh:twos.reduce(function(s,w){return s+(parseFloat(w.lh)||0);},0)};
  }).sort(function(a,b){return b.total-a.total;}).slice(0,6);

  // Yaklaşan bakımlar
  var upcoming = DB.equipment.filter(function(e){return e.nextMaint;}).map(function(e){
    var d=Math.ceil((new Date(e.nextMaint)-new Date())/86400000);
    return {name:e.name, days:d, date:e.nextMaint, area:e.area};
  }).filter(function(e){return e.days<=30;}).sort(function(a,b){return a.days-b.days;}).slice(0,6);

  // Renk paleti (Midnight Executive + Teal)
  var C = {
    navy:    '1E2761',
    iceBlue: 'CADCFC',
    white:   'FFFFFF',
    teal:    '0D9488',
    teal2:   '14B8A6',
    slate:   '475569',
    light:   'F1F5F9',
    red:     'EF4444',
    orange:  'F97316',
    green:   '10B981',
    purple:  'A78BFA',
    cyan:    '22D3EE',
    dark:    '0F172A',
    muted:   '64748B',
  };

  var pres = new PptxGenJS();
  pres.layout = 'LAYOUT_16x9';
  pres.title = 'Bakım Faaliyet Raporu — ' + raporAy + ' ' + raporYil;

  // ── YARDIMCI FONKSİYONLAR ──────────────────────────────────

    bullets.push('['+((WTYPES[w.type]&&WTYPES[w.type].lbl)||w.type)+'] '+(eq?eq.name+': ':'')+w.title.slice(0,55));
  });
  // Yaklaşan kritik bakımlar
  var critMaint = DB.equipment.filter(function(e){var d=Math.ceil((new Date(e.nextMaint)-new Date())/86400000);return e.nextMaint&&d<=14&&d>=0;}).slice(0,3);

  if(bullets.length === 0) bullets.push('Bu dönem tüm iş emirleri başarıyla tamamlandı.');

  var bulletItems = bullets.map(function(b, i){
    return {text:b, options:{bullet:true, breakLine:i<bullets.length-1, color:C.iceBlue, fontSize:12}};
  });
  s7.addText(bulletItems, {x:0.7, y:1.7, w:8.6, h:2.2, fontFace:'Calibri'});

  // Alt bilgi
  s7.addText(DB.settings.company + '  |  ' + DB.settings.facility + '  |  ' + raporAy + ' ' + raporYil, {x:0.7, y:4.9, w:8.5, h:0.3, fontSize:10, color:C.muted, fontFace:'Calibri'});

  // ═══════════════════════════
  // KAYDET
  // ═══════════════════════════
  var fileName = 'Bakim_Faaliyet_Raporu_' + raporAy + '_' + raporYil + '.pptx';
  pres.writeFile({fileName: fileName});
  toast('Sunum indiriliyor: ' + fileName);
}

// QR LANDING — Telefon ile okutunca açılan sayfa
// ═══════════════════════════════════════════════
var QR_EQ_ID = null;
var QR_ACTIVE = false;
var QR_TAB = 'workorders'; // info | workorders | new_wo
var QR_PENDING_TAB = 'workorders'; // QR okutulunca varsayılan açılacak sekme

function showQRLanding(eqId, tab) {
  QR_ACTIVE = true;
  QR_EQ_ID = eqId;
  QR_TAB = tab || QR_PENDING_TAB || 'workorders';
  var app = document.getElementById('app');
  app.innerHTML = renderQRLanding();
  bindQRLanding();
}

function normalizeQREqId(v) {
  if(!v) return '';
  v = String(v).trim();
  if(v.indexOf('PHARMA_MS:') === 0) v = v.replace('PHARMA_MS:','').trim();
  try {
    if(v.indexOf('http') === 0) {
      var u = new URL(v);
      v = u.searchParams.get('eq') || u.hash.replace(/^#qr=/,'') || v;
    }
  } catch(e) {}
  var m = v.match(/(?:[?&]eq=|#qr=)?([A-Za-z0-9_-]+)/);
  return m ? m[1].toUpperCase() : v.toUpperCase();
}

function consumePendingQR() {
  var raw = window._pendingQR || sessionStorage.getItem('pendingQR');
  if(!raw) return false;
  var eqId = normalizeQREqId(raw);
  var tab = sessionStorage.getItem('pendingQRTab') || QR_PENDING_TAB || 'workorders';
  if(tab === 'wo' || tab === 'is-emri') tab = 'workorders';
  var eqFound = (DB.equipment||[]).find(function(x){return String(x.id).toUpperCase()===eqId;});
  if(!eqFound) return false;
  window._pendingQR = null;
  sessionStorage.removeItem('pendingQR');
  sessionStorage.removeItem('pendingQRTab');
  showQRLanding(eqFound.id, tab);
  return true;
}

function getQRRequestFromURLOrStorage(){
  var raw = null, tab = 'workorders';
  try{
    var up = new URLSearchParams(window.location.search || '');
    raw = up.get('eq') || raw;
    tab = up.get('tab') || up.get('page') || tab;
  }catch(e){}
  try{
    var h = window.location.hash || '';
    if(h.indexOf('#qr=') === 0) raw = decodeURIComponent(h.replace('#qr=',''));
  }catch(e){}
  raw = raw || window._pendingQR || sessionStorage.getItem('pendingQR');
  tab = sessionStorage.getItem('pendingQRTab') || tab || QR_PENDING_TAB || 'workorders';
  if(tab === 'wo' || tab === 'is-emri' || tab === 'workorder') tab = 'workorders';
  if(tab === 'new' || tab === 'new_wo') tab = 'new_wo';
  return raw ? {raw:raw, eqId:normalizeQREqId(raw), tab:tab} : null;
}

function openQRWorkorderAfterLogin(){
  var req = getQRRequestFromURLOrStorage();
  if(!req || !req.eqId) return false;
  window._pendingQR = req.eqId;
  sessionStorage.setItem('pendingQR', req.eqId);
  sessionStorage.setItem('pendingQRTab', req.tab || 'workorders');
  showPendingRedirect('Ekipman iş emirleri açılıyor');
  var tries = 0;
  (function tryOpen(){
    tries++;
    var eqFound = (DB.equipment||[]).find(function(x){return String(x.id).toUpperCase()===req.eqId;});
    if(eqFound){
      window._pendingQR = null;
      sessionStorage.removeItem('pendingQR');
      sessionStorage.removeItem('pendingQRTab');
      showQRLanding(eqFound.id, req.tab || 'workorders');
      return;
    }
    if(tries < 10){ setTimeout(tryOpen, 300); return; }
    window._pendingQR = null;
    sessionStorage.removeItem('pendingQR');
    sessionStorage.removeItem('pendingQRTab');
    showQRLanding(req.eqId, req.tab || 'workorders');
  })();
  return true;
}

function saveQRWO(editId) {
  var title = (document.getElementById('qf-title')||{value:''}).value.trim();

  var status = (document.getElementById('qf-status')||{value:'acik'}).value;
  var ex = editId ? DB.workOrders.find(function(w){return w.id===editId;}) : null;
  var wo = {
    id: ex ? ex.id : 'WO-'+uid(),
    eqId: QR_EQ_ID,
    type: (document.getElementById('qf-type')||{value:'ariza'}).value || 'ariza',
    title: title,
    desc: (document.getElementById('qf-desc')||{value:''}).value || '',
    sev:  (document.getElementById('qf-sev')||{value:'orta'}).value || 'orta',
    status: status,
    date: (document.getElementById('qf-date')||{value:today()}).value || today(),
    due:  (document.getElementById('qf-due')||{value:''}).value || '',
    techId: (document.getElementById('qf-tech')||{value:''}).value || '',
    gmp: (document.getElementById('qf-gmp')||{checked:false}).checked || false,
    root: (document.getElementById('qf-root')||{value:''}).value || '',
    lh: parseFloat((document.getElementById('qf-lh')||{value:0}).value)||0,
    pc: parseFloat((document.getElementById('qf-pc')||{value:0}).value)||0,
    steps: ex ? ex.steps : [],
    docs: ex ? ex.docs : [],
    comments: ex ? ex.comments : [],
    by: ex ? ex.by : U.id,
    approvedBy: ex ? ex.approvedBy : '',
    closedAt: (status==='kapali' && !(ex&&ex.closedAt)) ? nowStr() : (ex ? ex.closedAt||'' : ''),
  };
  // Auto-set equipment status for critical failures
  if(wo.type==='ariza' && wo.sev==='kritik' && wo.status==='acik'){
    DB.equipment = DB.equipment.map(function(e){return e.id===QR_EQ_ID?Object.assign({},e,{status:'arizali'}):e;});
  }
  if(status==='kapali'){
    DB.equipment = DB.equipment.map(function(e){
      if(e.id===QR_EQ_ID && e.status==='arizali') return Object.assign({},e,{status:'aktif',lastMaint:today()});
      return e;
    });
  }
  if(ex) DB.workOrders = DB.workOrders.map(function(w){return w.id===wo.id?wo:w;});

function approveWOQR(woId) {

// ═══════════════════════════════════════════════
var _qrStream = null;
var _qrAnimId = null;
var _qrCanvas = null;
var _qrCtx = null;

function openQRScanner() {
  // Video+Canvas overlay oluştur
  var html = '<div id="qr-scanner-ov">'
    + '<div id="qr-scanner-bar">'
    + '<button onclick="closeQRScanner()" style="background:none;border:none;color:#fff;font-size:26px;cursor:pointer;line-height:1">←</button>'
    + '<div style="flex:1"><div style="font-size:15px;font-weight:700;color:#fff">QR Kod Tara</div><div style="font-size:11px;color:rgba(255,255,255,.6)">Kamerayı QR koda gösterin</div></div>'
    + '</div>'
    + '<div id="qr-video-wrap">'
    + '<video id="qr-video" autoplay playsinline muted></video>'
    + '<div id="qr-overlay"><div class="qr-frame"><div class="qr-corner-tr"></div><div class="qr-corner-bl"></div><div class="qr-scan-line"></div></div></div>'
    + '<div id="qr-status">QR kodu çerçeve içine alın</div>'
    + '</div>'
    + '</div>';

  document.body.insertAdjacentHTML('beforeend', html);

  // Kamera başlat
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    document.getElementById('qr-status').textContent = '❌ Kamera desteklenmiyor';
    return;
  }

  navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false})
    .then(function(stream) {
      _qrStream = stream;
      var video = document.getElementById('qr-video');
      if(!video) return;
      video.srcObject = stream;
      video.addEventListener('loadedmetadata', function() {
        video.play();
        _qrCanvas = document.createElement('canvas');
        _qrCtx = _qrCanvas.getContext('2d');
        requestAnimationFrame(scanFrame);
      });
    })
    .catch(function(err) {
      var msg = err.name === 'NotAllowedError'
        ? '❌ Kamera izni reddedildi. Tarayıcı ayarlarından izin verin.'
        : '❌ Kamera açılamadı: ' + err.message;
      var st = document.getElementById('qr-status');
      if(st) st.textContent = msg;
    });
}

function scanFrame() {
  var video = document.getElementById('qr-video');
  if(!video || !_qrCanvas || !_qrCtx || !document.getElementById('qr-scanner-ov')) return;

  if(video.readyState === video.HAVE_ENOUGH_DATA) {
    _qrCanvas.width  = video.videoWidth;
    _qrCanvas.height = video.videoHeight;
    _qrCtx.drawImage(video, 0, 0, _qrCanvas.width, _qrCanvas.height);
    var imageData = _qrCtx.getImageData(0, 0, _qrCanvas.width, _qrCanvas.height);

    if(typeof jsQR !== 'undefined') {
      var code = jsQR(imageData.data, imageData.width, imageData.height, {inversionAttempts:'dontInvert'});
      if(code && code.data) {
        handleQRResult(code.data);
        return; // stop scanning
      }
    } else {
      var st = document.getElementById('qr-status');
      if(st) st.textContent = '⏳ jsQR kütüphanesi yükleniyor...';
    }
  }

  _qrAnimId = requestAnimationFrame(scanFrame);
}

function handleQRResult(data) {
  closeQRScanner();

  // Desteklenen format: PHARMA_MS:EQ-001
  var eqId = null;
  // Format 1: PHARMA_MS:EQ-001 (kısa)
  if(data.startsWith('PHARMA_MS:')) {
    eqId = data.replace('PHARMA_MS:','').trim();
  }
  // Format 2: https://...?eq=EQ-001 (yeni URL format)
  if(!eqId) {
    var qMatch = data.match(/[?&]eq=([A-Z0-9\-]+)/);
    if(qMatch) eqId = qMatch[1];
  }
  // Format 3: URL içinde #qr=EQ-001 (eski format fallback)
  if(!eqId) {
    var hashMatch = data.match(/#qr=([A-Z0-9\-]+)/);
    if(hashMatch) eqId = hashMatch[1];
  }

  eqId = normalizeQREqId(eqId || data);
  if(!eqId) {
    toast('Tanınmayan QR kodu: ' + data.slice(0,30), 'warn');
    return;
  }

  var eq = DB.equipment.find(function(e){ return String(e.id).toUpperCase() === eqId; });
  if(!eq) {
    toast('Ekipman bulunamadı: ' + eqId, 'err');
    return;
  }

  toast('✓ ' + eq.name + ' — QR okundu', 'ok');
  QR_EQ_ID = eq.id;
  QR_TAB = 'workorders';
  showQRLanding(eq.id, 'workorders');
}

function closeQRScanner() {
  if(_qrAnimId) { cancelAnimationFrame(_qrAnimId); _qrAnimId = null; }
  if(_qrStream)  { _qrStream.getTracks().forEach(function(t){t.stop();}); _qrStream = null; }
  var el = document.getElementById('qr-scanner-ov');
  if(el) el.remove();
  _qrCanvas = null; _qrCtx = null;
}

function addSchedTask(){
  var container = document.getElementById('ms-tasks');
  if(!container) return;
  var div = document.createElement('div');
  div.style.cssText = 'display:flex;gap:8px;margin-bottom:6px';
  div.innerHTML = '<input class="inp isml" placeholder="Görev açıklaması..." style="flex:1"/>'
    +'<button type="button" onclick="this.parentElement.remove()" style="background:none;border:none;color:var(--rdl);cursor:pointer;font-size:20px;flex-shrink:0;line-height:1">×</button>';
  container.appendChild(div);
  div.querySelector('input').focus();
}

function saveSchedule(){
  var eqId  = v('ms-eq');
  var title = v('ms-title').trim();
  if(!eqId) { toast('Ekipman seçiniz','err'); return; }
  if(!title){ toast('Başlık zorunludur','err'); return; }
  var tasks = [];
  var container = document.getElementById('ms-tasks');
  if(container){
    container.querySelectorAll('input').forEach(function(inp){
      var val = (inp.value||'').trim();
      if(val) tasks.push(val);
    });
  }
  var ex = ET.schedule;
  var ms = {
    id:       ex ? ex.id : 'MS-'+uid(),
    eqId:     eqId,
    type:     v('ms-type') || 'onleyici',
    title:    title,
    interval: v('ms-interval') || '3 ay',
    next:     v('ms-next') || '',
    techId:   v('ms-tech') || '',
    estH:     parseFloat(v('ms-esth')) || 1,
    notes:    v('ms-notes') || '',
    tasks:    tasks,
  };
  if(!DB.schedule) DB.schedule = [];
  if(ex) DB.schedule = DB.schedule.map(function(s){ return s.id===ms.id ? ms : s; });
  else   DB.schedule = DB.schedule.concat([ms]);
  if(ms.next){
    var eqScheds = DB.schedule.filter(function(s){ return s.eqId===eqId && s.next; });
    if(eqScheds.length > 0){
      var nearest = eqScheds.reduce(function(a,b){ return a.next <= b.next ? a : b; });
      DB.equipment = DB.equipment.map(function(e){
        return e.id===eqId ? Object.assign({},e,{nextMaint:nearest.next}) : e;
      });
    }
  }
  // Yeni plan eklendiyse o ekipmanı seç
  if(!ex) SCHED_EQ = ms.eqId;
  dbSave();
  closeM('schedule');
  toast(ex ? 'Bakım planı güncellendi' : 'Bakım planı eklendi');
  renderPage();
}

function getKvalValueCols(testId){
  // rawRow: Excel'den okunan satır (Yıl hariç tüm sütunlar), index 0'dan başlar
  // cols: ['Alan/Oda', 'Nokta', 'col1', 'col2', ..., 'Sonuç', 'Notlar']
  // rawRow[0]=Alan, rawRow[1]=Nokta, rawRow[2]=col1, ...
  var maps = {
    partikul: [
      {label:'≥0.5µm (part/m³)', rawIdx:2},
      {label:'≥5.0µm (part/m³)', rawIdx:3},
      {label:'ISO Sınıfı',        rawIdx:4},
    ],
    filtre: [
      {label:'Filtre Tipi',      rawIdx:2},
      {label:'Upstream (µg/L)',  rawIdx:3},
      {label:'Downstream (µg/L)',rawIdx:4},
      {label:'Sızıntı %',        rawIdx:5},
    ],
    havadegisim: [
      {label:'Oda Hacmi (m³)',   rawIdx:2},
      {label:'Toplam Akış (m³/h)',rawIdx:3},
      {label:'ACH (h⁻¹)',        rawIdx:4},
    ],
    duman: [
      {label:'Yüksek Bas. Odası',rawIdx:1},
      {label:'Düşük Bas. Odası', rawIdx:2},
      {label:'Basınç Farkı (Pa)',rawIdx:3},
      {label:'Duman Akışı',      rawIdx:5},
    ],
    dekont: [
      {label:'BI Türü',          rawIdx:2},
      {label:'Döngü Süresi (dk)',rawIdx:4},
      {label:'İnkübasyon Sonucu',rawIdx:5},
      {label:'Log Azalma',       rawIdx:6},
    ],
    sicakliknem: [
      {label:'Min Sıcaklık (°C)',rawIdx:2},
      {label:'Max Sıcaklık (°C)',rawIdx:3},
      {label:'Ort. Sıcaklık (°C)',rawIdx:4},
      {label:'Min Nem (%RH)',    rawIdx:5},
      {label:'Max Nem (%RH)',    rawIdx:6},
      {label:'Ort. Nem (%RH)',   rawIdx:7},
    ],
  };
  return maps[testId]||[{label:'Değer',rawIdx:-1}];
}

var KVAL_EDIT_STEPS = false;

function addKvalStep(){
  var container=document.getElementById('steps-edit-container');
  if(!container)return;
  var div=document.createElement('div');
  div.style.cssText='display:flex;gap:8px;margin-bottom:8px;align-items:flex-start';
  var idx=container.querySelectorAll('[data-step-idx]').length;
  div.innerHTML='<span style="background:var(--orl);color:#fff;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;margin-top:4px">'+(idx+1)+'</span>'
    +'<textarea class="inp" data-step-idx="'+idx+'" style="flex:1;min-height:48px;font-size:12px;resize:vertical" placeholder="Yeni adım..."></textarea>'
    +'<button onclick="this.parentElement.remove()" style="background:none;border:none;color:var(--rdl);cursor:pointer;font-size:18px;flex-shrink:0;margin-top:2px">×</button>';
  container.appendChild(div);
  div.querySelector('textarea').focus();
}

function removeKvalStep(idx){
  var ta=document.querySelector('[data-step-idx="'+idx+'"]');
  if(ta&&ta.parentElement)ta.parentElement.remove();
}

function saveKvalSteps(){
  var steps=[];
  document.querySelectorAll('#steps-edit-container [data-step-idx]').forEach(function(ta){
    var val=(ta.value||'').trim();
    if(val)steps.push(val);
  });
  if(steps.length===0){toast('En az bir adım giriniz','err');return;}
  if(!DB.kvalSteps)DB.kvalSteps={};
  DB.kvalSteps[KVAL_ACTIVE]=steps;
  dbSave();
  KVAL_EDIT_STEPS=false;
  toast('Hazırlık adımları kaydedildi ✓');
  renderPage();
}

// ── Excel Şablonu İndir ──────────────────────────────────────
function downloadKvalTemplate(testId){
  if(typeof XLSX==='undefined'){toast('XLSX kütüphanesi yükleniyor...','warn');return;}
  var test = KVAL_TESTS[testId];
  if(!test){return;}
  var wb = XLSX.utils.book_new();
  // Talimat sayfası
  var instrData = [
    ['NOBEL İLAÇ — KALİFİKASYON VERİ GİRİŞ ŞABLONU'],
    ['Test Türü: '+test.lbl],
    [''],
    ['DOLDURMA TALİMATLARI:'],
    ['1. "Veri" sekmesine geçin'],
    ['2. Yıl sütununa ölçüm yılını girin (örn: 2024)'],
    ['3. Tüm alanları doldurun'],
    ['4. Sonuç sütununa: UYGUN veya UYGUN DEĞİL yazın'],
    ['5. Dosyayı kaydedin ve uygulamaya yükleyin'],
    [''],
    ['Kabul Limitleri:'],
    [test.limits],
  ];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(instrData), 'Talimatlar');
  // Veri sayfası
  var headers = ['Yıl'].concat(test.cols);
  var dataRows = test.exampleData.map(function(row){return ['2024'].concat(row);});
  var ws = XLSX.utils.aoa_to_sheet([headers].concat(dataRows));
  // Sütun genişlikleri
  ws['!cols'] = headers.map(function(h){return {wch:Math.max(h.length+2,14)};});
  XLSX.utils.book_append_sheet(wb, ws, 'Veri');
  XLSX.writeFile(wb, 'Kalifikasyon_'+testId+'_Sablonu.xlsx');
  toast('Şablon indirildi: Kalifikasyon_'+testId+'_Sablonu.xlsx');
}

// ── Excel Yükle ───────────────────────────────────────────────
function uploadKvalExcel(inp, testId){
  var file = inp.files[0];
  if(!file) return;
  if(typeof XLSX==='undefined'){toast('XLSX kütüphanesi yükleniyor...','warn');return;}
  var reader = new FileReader();
  reader.onload = function(e){
    try{
      var wb = XLSX.read(e.target.result, {type:'array'});
      // "Veri" sayfasını bul
      var wsName = wb.SheetNames.find(function(n){return n==='Veri';}) || wb.SheetNames[0];
      var ws = wb.Sheets[wsName];
      var rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
      if(rows.length < 2){toast('Dosyada veri bulunamadı','err');return;}
      // Başlık satırı
      var headers = rows[0].map(function(h){return String(h).trim();});
      var yilIdx    = headers.findIndex(function(h){return h==='Yıl'||h==='YIL'||h==='yil';});
      var areaIdx   = headers.findIndex(function(h){return h.indexOf('Alan')>=0||h.indexOf('Oda')>=0||h.indexOf('alan')>=0;});
      var pointIdx  = headers.findIndex(function(h){return h.indexOf('Oda Ad')>=0||h.indexOf('oda ad')>=0||h.indexOf('Nokta')>=0||h.indexOf('nokta')>=0||h.indexOf('Point')>=0;});
      var valueIdx  = headers.findIndex(function(h){return h.indexOf('µm')>=0||h.indexOf('Akış')>=0||h.indexOf('ACH')>=0||h.indexOf('Sıcaklık')>=0||h.indexOf('Basınç')>=0||h.indexOf('Konsantrasyon')>=0||h.indexOf('Downstream')>=0||h.indexOf('İnkübasyon')>=0;});
      var resultIdx = headers.findIndex(function(h){return h==='Sonuç'||h==='sonuç'||h==='Result';});
      var notesIdx  = headers.findIndex(function(h){return h==='Notlar'||h==='notlar'||h==='Notes';});

      if(yilIdx<0){toast('Yıl sütunu bulunamadı. Şablonu kullandığınızdan emin olun.','err');return;}

      // Yıl bazlı grupla
      var byYear = {};
      for(var i=1;i<rows.length;i++){
        var row = rows[i];
        if(!row[yilIdx]) continue;
        var yr = String(row[yilIdx]).trim();
        if(!yr||yr==='') continue;
        if(!byYear[yr]) byYear[yr]=[];
        // Tüm sütunları kaydet
        var entry = {
          area:   areaIdx>=0  ? String(row[areaIdx]||'').trim()  : '—',
          point:  pointIdx>=0 ? String(row[pointIdx]||'').trim() : '—',
          value:  valueIdx>=0 ? String(row[valueIdx]||'').trim() : '',
          result: resultIdx>=0? String(row[resultIdx]||'').trim(): '',
          notes:  notesIdx>=0 ? String(row[notesIdx]||'').trim() : '',
          rawRow: row.slice(1).map(function(v){return String(v||'').trim();}), // Yıl hariç tüm sütunlar
        };
        byYear[yr].push(entry);
      }

      var years = Object.keys(byYear);
      if(years.length===0){toast('Geçerli veri satırı bulunamadı','err');return;}

      if(!DB.kvalData) DB.kvalData={};
      if(!DB.kvalData[testId]) DB.kvalData[testId]={};
      // Yeni verileri mevcut verilere ekle (üzerine yaz)
      years.forEach(function(yr){ DB.kvalData[testId][yr]=byYear[yr]; });
      dbSave();
      toast(years.length+' yıl, '+Object.values(byYear).reduce(function(s,r){return s+r.length;},0)+' kayıt yüklendi ✓');
      renderPage();
    }catch(err){
      console.error(err);
      toast('Excel okuma hatası: '+err.message,'err');
    }
  };
  reader.readAsArrayBuffer(file);
  inp.value=''; // Reset
}

// ── Yıl Sil ──────────────────────────────────────────────────
function deleteKvalYear(testId){
  var kd = DB.kvalData||{};
  var years = Object.keys(kd[testId]||{}).sort();
  if(years.length===0){toast('Silinecek veri yok','warn');return;}
  var yr = prompt('Hangi yılın verisini silmek istiyorsunuz?\nMevcut yıllar: '+years.join(', '));
  if(!yr) return;
  yr = yr.trim();
  if(!kd[testId]||!kd[testId][yr]){toast(yr+' yılı için veri bulunamadı','err');return;}
  if(!confirm(yr+' yılına ait '+kd[testId][yr].length+' kayıt silinecek. Emin misiniz?')) return;
  delete DB.kvalData[testId][yr];
  dbSave();
  toast(yr+' yılı verisi silindi','warn');
  renderPage();
}

function addLog(action, detail, oldVal, newVal) {
  if(!DB.logs) DB.logs = [];
  var entry = {
    id:     'L-' + uid(),
    ts:     nowStr(),
    user:   U ? U.name : 'Sistem',
    role:   U ? (ROLES[U.role]&&ROLES[U.role].lbl||U.role) : '—',
    page:   PAGE,
    action: action,
    detail: detail || '',
    oldVal: oldVal !== undefined ? String(oldVal) : '',
    newVal: newVal !== undefined ? String(newVal) : '',
  };
  DB.logs.unshift(entry); // En yeni başa
  if(DB.logs.length > 500) DB.logs = DB.logs.slice(0, 500);
  // Log kaydı için dbSave çağırmıyoruz — ana işlemin dbSave'i yeterli
}

    'Ekipman':       '#22d3ee',
    'Kullanıcı':     '#a78bfa',
    'Yedek Parça':   '#f59e0b',
    'Stok Hareketi': '#f97316',
    'Teknisyen':     '#14b8a6',
    'Kalifikasyon':  '#8b5cf6',
    'Ayarlar':       '#64748b',
    'Sistem':        '#94a3b8',
  };

  var rows = logs.map(function(l) {
    var col = '#4f8ef7';
    Object.keys(actionColors).forEach(function(k){ if(l.action.indexOf(k)>=0) col=actionColors[k]; });
    return '<tr>'
      + '<td style="font-size:11px;color:var(--mt);white-space:nowrap">'+esc(l.ts)+'</td>'
      + '<td><div style="font-weight:600;font-size:12px">'+esc(l.user)+'</div><div style="font-size:10px;color:var(--mt)">'+esc(l.role)+'</div></td>'
      + '<td><span style="background:'+col+'18;color:'+col+';border:1px solid '+col+'40;border-radius:5px;padding:2px 8px;font-size:11px;font-weight:700;white-space:nowrap">'+esc(l.action)+'</span></td>'
      + '<td style="font-size:12px;max-width:200px">'+esc(l.detail)+'</td>'
      + '<td style="font-size:11px;color:var(--mt);max-width:140px">'+(l.oldVal?'<span style="color:var(--rdl)">'+esc(l.oldVal.slice(0,40))+'</span>':'—')+'</td>'
      + '<td style="font-size:11px;color:var(--mt);max-width:140px">'+(l.newVal?'<span style="color:var(--gnl)">'+esc(l.newVal.slice(0,40))+'</span>':'—')+'</td>'
      + '<td style="font-size:10px;color:var(--mt)">'+esc(l.page||'—')+'</td>'
      + '</tr>';
  }).join('');

  var stats = {};
  logs.forEach(function(l){
    Object.keys(actionColors).forEach(function(k){ if(l.action.indexOf(k)>=0){ stats[k]=(stats[k]||0)+1; } });
  });

  var statsH = Object.entries(stats).slice(0,6).map(function(e){
    var col = actionColors[e[0]]||'#4f8ef7';
    return '<div class="sc" style="border-color:'+col+'25"><div class="sa" style="background:'+col+'"></div>'
      +'<div class="sv" style="color:'+col+';font-size:26px">'+e[1]+'</div>'
      +'<div class="sl">'+e[0]+'</div></div>';
  }).join('');

  return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">'
    +'<div style="font-size:20px;font-weight:800;letter-spacing:-.3px">📜 Aktivite Logu</div>'
    +'<div style="display:flex;gap:8px">'
    +'<span style="font-size:12px;color:var(--mt);padding:6px 12px;background:var(--bg2);border-radius:7px;border:1px solid var(--bd)">Son 500 kayıt</span>'
    +(can('s')&&logs.length>0?'<button class="btn bdng bsm" onclick="clearLogs()">🗑 Logları Temizle</button>':'')
    +'</div></div>'
    +(statsH?'<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:20px">'+statsH+'</div>':'')
    +'<div class="card" style="padding:12px;margin-bottom:14px">'
    +'<input class="inp isml" id="log-q" placeholder="Kullanıcı, işlem veya detay ara..." style="width:100%" oninput="renderPage()"/>'
    +'</div>'
    +(logs.length===0
      ? '<div class="empty"><div style="font-size:36px;margin-bottom:10px">📭</div><div style="font-size:14px;font-weight:600;color:var(--sub)">Henüz log kaydı yok</div></div>'
      : '<div class="card" style="padding:0;overflow:hidden"><div style="overflow-x:auto"><table class="tbl">'
        +'<thead><tr><th>Zaman</th><th>Kullanıcı</th><th>İşlem</th><th>Detay</th><th>Eski Değer</th><th>Yeni Değer</th><th>Sayfa</th></tr></thead>'
        +'<tbody>'+rows+'</tbody></table></div></div>');
}

function clearLogs(){
  if(!can('s')){toast('Yetki yok','err');return;}
  if(!confirm('Tüm log kayıtları silinecek. Emin misiniz?'))return;
  DB.logs=[];
  dbSave();
  toast('Loglar temizlendi','warn');
  renderPage();
}

var SP_Q = '';
var SP_CAT = 'all';
var MODAL_SP = false;
var MODAL_SP_MOV = false;
var ET_SP = null;
var ET_SP_MOV = null;

var SP_UNITS = ['Adet','Kutu','Paket','Metre','Litre','Kg','Gram','Rulo','Çift','Set'];
// SP_CATS artık DB.spareCats'ten gelir — yönetici düzenleyebilir

function pgSpareParts(){
  var parts    = DB.spareParts || [];
  var SP_Q_VAL = SP_Q || '';
  var SP_C_VAL = SP_CAT || 'all';

  // Filtrele
  var filtered = parts.filter(function(p){
    if(SP_C_VAL !== 'all' && p.cat !== SP_C_VAL) return false;
    if(SP_Q_VAL){
      var q = SP_Q_VAL.toLowerCase();
      if((p.name||'').toLowerCase().indexOf(q)<0
       &&(p.code||'').toLowerCase().indexOf(q)<0
       &&(p.location||'').toLowerCase().indexOf(q)<0) return false;
    }
    return true;
  });

  // İstatistikler
  var kritikStok  = parts.filter(function(p){return p.stock>0&&p.stock<=p.minStock;}).length;
  var sifirStok   = parts.filter(function(p){return p.stock<=0;}).length;
  var toplamCesit = parts.length;

  var statsH = [
    {lbl:'Toplam Çeşit', v:toplamCesit, col:'var(--bll)'},
    {lbl:'Kritik Stok',  v:kritikStok,  col:'var(--orl)'},
    {lbl:'Sıfır Stok',   v:sifirStok,   col:'var(--rdl)'},
  ].map(function(s){
    return '<div class="sc" style="border-color:'+s.col+'25"><div class="sa" style="background:'+s.col+'"></div>'
      +'<div class="sv" style="color:'+s.col+'">'+s.v+'</div><div class="sl">'+s.lbl+'</div></div>';
  }).join('');

  // Kategori filtreleri
  var cats = ['all'].concat([].concat.apply([],[(DB.spareCats||[])]).filter(function(v,i,a){return a.indexOf(v)===i;}).sort());
  var catH = cats.map(function(cat){
    var cnt = cat==='all' ? parts.length : parts.filter(function(p){return p.cat===cat;}).length;
    var active = SP_C_VAL===cat;
    return '<button onclick="SP_CAT=\''+cat+'\';renderPage()" style="'
      +'background:'+(active?'var(--bl)':'var(--bg3)')+';'
      +'color:'+(active?'#fff':'var(--sub)')+';'
      +'border:1px solid '+(active?'var(--bl)':'var(--bd)')+';'
      +'border-radius:20px;padding:4px 14px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap">'
      +esc(cat==='all'?'Tümü':cat)+' <span style="opacity:.7">('+cnt+')</span></button>';
  }).join('');

  // Kart listesi
  var cardsH = filtered.length===0
    ? emptyHTML('Parça bulunamadı')
    : filtered.map(function(p){
        var isKritik = p.stock>0 && p.stock<=p.minStock;
        var isSifir  = p.stock<=0;
        var stockCol = isSifir?'var(--rdl)':isKritik?'var(--orl)':'var(--gnl)';
        var pct = p.minStock>0 ? Math.min(100,Math.round((p.stock/p.minStock)*100)) : 100;
        return '<div style="background:var(--bg2);border:1px solid '+(isSifir?'rgba(239,68,68,.4)':isKritik?'rgba(245,158,11,.4)':'var(--bdl)')+';border-radius:12px;padding:16px">'
          +'<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">'
          +'<div style="flex:1">'
          +'<div style="font-size:10px;font-family:monospace;color:var(--mt);margin-bottom:3px">'+esc(p.code||p.id)+'</div>'
          +'<div style="font-size:14px;font-weight:800">'+esc(p.name)+'</div>'
          +'<div style="font-size:11px;color:var(--mt);margin-top:2px">'+esc(p.cat||'—')+' · 📍 '+esc(p.location||'—')+'</div>'
          +'</div>'
          +'<div style="text-align:right;flex-shrink:0;margin-left:10px">'
          +'<div style="font-size:28px;font-weight:900;color:'+stockCol+'">'+p.stock+'</div>'
          +'<div style="font-size:10px;color:var(--mt)">'+esc(p.unit||'Adet')+'</div>'
          +'</div></div>'
          +'<div style="margin-bottom:10px">'
          +'<div style="display:flex;justify-content:space-between;font-size:10px;color:var(--mt);margin-bottom:4px">'
          +'<span>Stok Durumu</span><span>Min: '+p.minStock+' '+esc(p.unit||'Adet')+'</span>'
          +'</div>'
          +'<div class="pbar"><div class="pfil" style="width:'+pct+'%;background:'+stockCol+'"></div></div>'
          +'</div>'
          +(isSifir?'<div style="background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:6px;padding:6px 10px;font-size:11px;font-weight:700;color:var(--rdl);margin-bottom:10px">⚠ STOK TÜKENDİ</div>'
            :isKritik?'<div style="background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);border-radius:6px;padding:6px 10px;font-size:11px;font-weight:700;color:var(--orl);margin-bottom:10px">⚠ KRİTİK STOK</div>':'')
          +'<div style="display:flex;gap:6px;flex-wrap:wrap">'
          +(can('w')?'<button class="btn bsuc bxs" onclick="openSpareMovModal(\''+p.id+'\',\'giris\')">⬆ Giriş</button>':'')
          +(can('w')?'<button class="btn bout bxs" onclick="openSpareMovModal(\''+p.id+'\',\'cikis\')">⬇ Çıkış</button>':'')
          +'<button class="btn bghs bxs" onclick="openSpareQR(\''+p.id+'\')">📱 QR</button>'
          +(can('s')?'<button class="btn bghs bxs" onclick="openSpareForm(\''+p.id+'\')">✏</button>':'')
          +(can('s')?'<button class="btn bdng bxs" onclick="deleteSparePart(\''+p.id+'\')">🗑</button>':'')
          +'</div>'
          +'</div>';
      }).join('');

  // ── HTML ──────────────────────────────────────────────────
  var html = '';

  // Başlık + Butonlar
  html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px">';
  html += '<div style="font-size:20px;font-weight:800;letter-spacing:-.3px">🔩 Yedek Parça & Depo</div>';
  html += '<div style="display:flex;gap:8px;flex-wrap:wrap">';
  if(can('s')) html += '<button class="btn bghs bsm" onclick="openSpareCatMgr()">🏷 Kategoriler</button>';
  if(can('s')) html += '<button class="btn bout bsm" onclick="downloadSpareTemplate()">⬇ Excel Şablonu</button>';
  if(can('s')) html += '<label class="btn bsuc bsm" style="cursor:pointer;display:inline-flex;align-items:center;gap:6px">📤 Excel Yükle<input type="file" accept=".xlsx,.xls" style="display:none" onchange="uploadSpareExcel(this)"/></label>';
  if(can('s')) html += '<button class="btn bpri bsm" onclick="openSpareForm(null)">+ Parça Ekle</button>';
  html += '</div></div>';

  // İstatistikler
  html += '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px">'+statsH+'</div>';

  // Arama + Kategori
  html += '<div class="card" style="padding:12px;margin-bottom:14px">';
  html += '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">';
  html += '<input class="inp isml" id="sp-q" placeholder="Parça adı, kodu veya konum ara..." style="flex:1;min-width:200px" value="'+esc(SP_Q_VAL)+'" oninput="SP_Q=this.value;renderPage()"/>';
  html += '<div style="display:flex;gap:6px;flex-wrap:wrap">'+catH+'</div>';
  html += '</div></div>';

  // Kritik uyarı banner
  if(kritikStok>0||sifirStok>0){
    html += '<div class="alert" style="background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);margin-bottom:16px">'
      +'<span style="font-size:20px">⚠</span>'
      +'<div>'+(sifirStok>0?'<strong style="color:var(--rdl)">'+sifirStok+' parça tükenmiş!</strong> ':'')
      +(kritikStok>0?'<strong style="color:var(--orl)">'+kritikStok+' parça kritik stok seviyesinde.</strong>':'')
      +' Sipariş verilmesi önerilir.</div></div>';
  }

  // Kart grid
  html += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px">'+cardsH+'</div>';

  return html;
}

function saveSparePart(){
  var name = v('sp-name').trim();
  if(!name){toast('Parça adı zorunludur','err');return;}
  var ex = ET_SP;
  var oldData = ex ? JSON.stringify({name:ex.name,stock:ex.stock,location:ex.location}) : null;
  var part = {
    id:       ex ? ex.id : 'SP-'+uid(),
    name:     name,
    cat:      v('sp-cat')||'Genel',
    code:     v('sp-code')||'',
    stock:    parseInt(v('sp-stock'))||0,
    minStock: parseInt(v('sp-min'))||5,
    unit:     v('sp-unit')||'Adet',
    location: v('sp-loc')||'',
    createdAt: ex ? ex.createdAt : today(),
  };
  if(!DB.spareParts)DB.spareParts=[];
  if(ex){
    DB.spareParts=DB.spareParts.map(function(p){return p.id===part.id?part:p;});
    addLog('Yedek Parça Düzenlendi', part.name, oldData, JSON.stringify({name:part.name,stock:part.stock,location:part.location}));
    toast('Parça güncellendi');
  } else {
    DB.spareParts=DB.spareParts.concat([part]);
    addLog('Yedek Parça Eklendi', part.name, '', 'Stok: '+part.stock+' '+part.unit);
    toast('Parça eklendi');
  }
  dbSave();
  closeSpareModal();
  renderPage();
}

function deleteSparePart(id){
  if(!can('s')){toast('Yönetici yetkisi gerekli','err');return;}
  var p=(DB.spareParts||[]).find(function(x){return x.id===id;});
  if(!p){toast('Parça bulunamadı','err');return;}
  if(!confirm(p.name+' parçasını silmek istiyor musunuz?\n\nBu işlem geri alınamaz!'))return;
  DB.spareParts=DB.spareParts.filter(function(x){return x.id!==id;});
  DB.spareMovements=(DB.spareMovements||[]).filter(function(m){return m.partId!==id;});
  addLog('Yedek Parça Silindi', p.name, 'Stok: '+p.stock+' '+p.unit, '');
  dbSave();
  toast(p.name+' silindi','warn');
  renderPage();
}

function closeSpareModal(){
  MODAL_SP=false;ET_SP=null;
  var el=document.getElementById('ov-spare');if(el)el.remove();
}

function saveSpareMovement(){
  var m = ET_SP_MOV||{};
  var p = (DB.spareParts||[]).find(function(x){return x.id===m.partId;});
  if(!p){toast('Parça bulunamadı','err');return;}
  var qty    = parseInt((document.getElementById('spm-qty')||{value:0}).value)||0;
  var reason = (document.getElementById('spm-reason')||{value:''}).value.trim();
  var woId   = (document.getElementById('spm-wo')||{value:''}).value||'';
  var eqId   = (document.getElementById('spm-eq')||{value:''}).value||'';
  if(qty<=0){toast('Miktar 0\'dan büyük olmalı','err');return;}
  if(!reason){toast('Açıklama zorunludur','err');return;}
  var isGiris = m.type==='giris';
  if(!isGiris&&p.stock<qty){toast('Yetersiz stok! Mevcut: '+p.stock+' '+p.unit,'err');return;}
  var oldStock=p.stock;
  var newStock=isGiris?p.stock+qty:p.stock-qty;
  var ts=nowStr();
  // Stok güncelle
  DB.spareParts=DB.spareParts.map(function(x){
    return x.id===p.id?Object.assign({},x,{stock:newStock}):x;
  });
  // Hareket kaydı
  var mov={id:'MOV-'+uid(),partId:p.id,type:m.type,qty:qty,reason:reason,woId:woId,eqId:eqId,user:U?U.name:'—',ts:ts};

        +' | Neden: '+reason
        +' | Stok: '+oldStock+'→'+newStock+' '+p.unit;

      if(!isGiris){

function submitSpareMovQR(spId, type){
  var p=(DB.spareParts||[]).find(function(x){return x.id===spId;});
  if(!p){toast('Parça bulunamadı','err');return;}
  var qtyEl    = document.getElementById('qspm-qty');
  var reasonEl = document.getElementById('qspm-reason');
  var woEl     = document.getElementById('qspm-wo');
  var qty    = parseInt(qtyEl?qtyEl.value:0)||0;
  var reason = reasonEl?reasonEl.value.trim():'';
  var woId   = woEl?woEl.value:'';
  var isGiris = type==='giris';
  if(qty<=0){toast('Miktar 0\'dan büyük olmalı','err');return;}
  if(!reason){toast('Açıklama zorunludur','err');return;}
  if(!isGiris&&p.stock<qty){toast('Yetersiz stok! Mevcut: '+p.stock+' '+p.unit,'err');return;}
  var oldStock = p.stock;
  var newStock = isGiris?p.stock+qty:p.stock-qty;
  DB.spareParts=DB.spareParts.map(function(x){
    return x.id===spId?Object.assign({},x,{stock:newStock}):x;
  });
  if(!DB.spareMovements)DB.spareMovements=[];
  var ts2=nowStr();
  DB.spareMovements.unshift({
    id:'MOV-'+uid(), partId:spId,
    type:type, qty:qty, reason:reason,
    woId:woId, user:U?U.name:'—', ts:ts2,
  });
  // İş emrine yorum ekle
  if(woId){
    var wo2=DB.workOrders.find(function(w){return w.id===woId;});
    if(wo2){
      if(!wo2.comments)wo2.comments=[];
      var cmtText2='🔩 Yedek Parça '+(isGiris?'Girişi':'Çıkışı')+': '
        +p.name+' ('+esc(p.code||p.id)+') — '
        +qty+' '+p.unit
        +' | Neden: '+reason
        +' | Stok: '+oldStock+'→'+newStock+' '+p.unit;
      wo2.comments.push({user:U?U.name:'—',text:cmtText2,date:ts2,type:'spare_part'});
      DB.workOrders=DB.workOrders.map(function(w){return w.id===woId?wo2:w;});
    }
  }
  addLog('Stok Hareketi ('+(isGiris?'Giriş':'Çıkış')+')',
    p.name+' — '+qty+' '+p.unit+(woId?' ['+woId+']':''),
    oldStock+' '+p.unit, newStock+' '+p.unit);
  dbSave();
  toast((isGiris?'✓ Giriş':'✓ Çıkış')+' kaydedildi: '+qty+' '+p.unit+(woId?' → '+woId+' iş emrine eklendi':'')+' | Yeni stok: '+newStock);
  // Başarı sonrası landing'e dön
  setTimeout(function(){showSpareQRLanding(spId);},300);
}

// ── Yedek Parça Excel Yükleme ─────────────────────────────────
function uploadSpareExcel(inp){
  if(!can('s')){toast('Bu işlem için Yönetici yetkisi gerekli','err');return;}
  var file = inp.files[0];
  if(!file) return;
  if(typeof XLSX==='undefined'){toast('XLSX kütüphanesi yüklenemedi','err');return;}

  var reader = new FileReader();
  reader.onload = function(e){
    try{
      var wb = XLSX.read(e.target.result, {type:'array'});
      // "Parçalar" sayfasını bul
      var wsName = wb.SheetNames.find(function(n){
        return n==='Parçalar'||n==='Parcalar'||n==='Sheet1'||n==='Sayfa1';
      }) || wb.SheetNames[0];
      var ws = wb.Sheets[wsName];
      var rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
      if(rows.length < 2){toast('Dosyada veri bulunamadı','err');return;}

      var headers = rows[0].map(function(h){return String(h).trim().toLowerCase();});
      // Kolon indexleri bul
      function findCol(keywords){
        // Tam eşleşmeyi önce dene
        var exact = headers.findIndex(function(h){
          return keywords.some(function(k){return h===k;});
        });
        if(exact>=0) return exact;
        // Sonra kısmi eşleşme
        return headers.findIndex(function(h){
          return keywords.some(function(k){return h.indexOf(k)>=0;});
        });
      }
      var idxName  = findCol(['parça adı','parca adi','ad','name']);
      var idxCode  = findCol(['stok kodu','parca kodu','part code','code','kod']);
      var idxCat   = findCol(['kategori','category','cat']);
      var idxUnit  = findCol(['birim','unit']);
      var idxStock = findCol(['mevcut stok','stok miktarı','stok adedi','stock qty','miktar','quantity']);
      var idxMin   = findCol(['minimum','min stok','min']);
      var idxLoc   = findCol(['raf','konum','location','loc']);

      if(idxName<0||idxCode<0){
        toast('Parça Adı ve Stok Kodu sütunları zorunludur. Şablonu kullanın.','err');
        return;
      }

      if(!DB.spareParts) DB.spareParts=[];
      var added=0, updated=0, skipped=0;

      for(var i=1;i<rows.length;i++){
        var row = rows[i];
        var name = String(row[idxName]||'').trim();
        var code = String(row[idxCode]||'').trim();
        if(!name || !code) {skipped++;continue;}

        var stock   = parseInt(row[idxStock])||0;
        var minStock= parseInt(row[idxMin])||5;
        var cat     = String(row[idxCat]||'Genel').trim();
        var unit    = String(row[idxUnit]||'Adet').trim();
        var loc     = String(idxLoc>=0?row[idxLoc]||'':'').trim();

        // Aynı kod varsa güncelle
        var existing = DB.spareParts.find(function(p){return p.code===code;});
        if(existing){
          Object.assign(existing,{name:name,cat:cat,unit:unit,stock:stock,minStock:minStock,location:loc});
          updated++;
        } else {
          DB.spareParts.push({
            id:'SP-'+uid(),
            name:name, code:code, cat:cat,
            unit:unit, stock:stock, minStock:minStock,
            location:loc, createdAt:today()
          });
          added++;
        }
      }

      addLog('Yedek Parça Excel Yüklendi',
        added+' eklendi, '+updated+' güncellendi',
        '',added+'+'+updated+' kayıt');
      dbSave();
      inp.value='';
      toast('✓ '+added+' yeni parça eklendi, '+updated+' güncellendi'+(skipped?' ('+skipped+' satır atlandı)':''));
      renderPage();
    }catch(err){
      console.error(err);
      toast('Excel okuma hatası: '+err.message,'err');
    }
  };
  reader.readAsArrayBuffer(file);
}

function addSpareCat(){
  var inp = document.getElementById('sp-cat-inp');
  var val = inp ? inp.value.trim() : '';
  if(!val){toast('Kategori adı boş olamaz','err');return;}
  if((DB.spareCats||[]).indexOf(val)>=0){toast('Bu kategori zaten var','warn');return;}
  if(!DB.spareCats)DB.spareCats=[];
  DB.spareCats.push(val);
  if(inp)inp.value='';
  // Listeyi güncelle
  var list = document.getElementById('sp-cat-list');
  if(list){
    var i = DB.spareCats.length-1;
    var div = document.createElement('div');
    div.style.cssText='display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg3);border-radius:7px;border:1px solid var(--bd);margin-bottom:6px';
    div.innerHTML='<span style="flex:1;font-size:13px;font-weight:600">'+esc(val)+'</span>'
      +'<button onclick="removeSpareCat('+i+')" style="background:none;border:none;color:var(--rdl);cursor:pointer;font-size:18px;line-height:1;flex-shrink:0">×</button>';
    list.appendChild(div);
  }
}

function removeSpareCat(idx){
  var cat = DB.spareCats && DB.spareCats[idx];
  if(!cat) return;
  // Bu kategorideki parça var mı kontrol et
  var inUse = (DB.spareParts||[]).filter(function(p){return p.cat===cat;}).length;
  if(inUse>0){
    if(!confirm(cat+' kategorisinde '+inUse+' parça var. Yine de silmek istiyor musunuz?'))return;
  }
  DB.spareCats.splice(idx,1);
  // Modal'ı yenile
  renderModals();
}

function saveSpareCats(){
  addLog('Yedek Parça Kategorileri Güncellendi','','','Toplam: '+(DB.spareCats||[]).length+' kategori');
  dbSave();
  closeSpareCatMgr();
  toast('Kategoriler kaydedildi ✓');
  renderPage();
}

function closeSpareCatMgr(){
  MODAL_SP_CAT=false;
  var el=document.getElementById('ov-sp-cat');if(el)el.remove();
}
