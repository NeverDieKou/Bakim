<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg0:#04111f;--bg1:#071827;--bg2:#0b1f33;--bg3:#0f273f;--bg4:#13304c;
  --bd:#1a3a58;--bdl:#20486e;
  --tx:#dceaf8;--sub:#8fb8d8;--mt:#3f6e96;
  --bl:#2563eb;--bll:#4f8ef7;--bld:#1a4ab5;
  --gn:#059669;--gnl:#10b981;
  --rd:#dc2626;--rdl:#ef4444;
  --or:#d97706;--orl:#f59e0b;
  --pu:#7c3aed;--pul:#a78bfa;
  --cy:#0891b2;--cyl:#22d3ee;
}
body{background:var(--bg0);color:var(--tx);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;font-size:14px;line-height:1.5}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:var(--bg1)}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}
input,select,textarea,button{font-family:inherit}
#wrap{display:flex;flex-direction:column;min-height:100vh}
#bar{background:var(--bg1);border-bottom:1px solid var(--bdl);height:56px;display:flex;align-items:center;padding:0 20px;gap:10px;position:sticky;top:0;z-index:300;flex-shrink:0}
#nav{display:flex;gap:2px;overflow-x:auto;flex:1}
#nav::-webkit-scrollbar{display:none}
#tr{display:flex;gap:8px;align-items:center;flex-shrink:0}
#main{flex:1;padding:24px;max-width:1400px;margin:0 auto;width:100%}
.nb{background:transparent;border:1px solid transparent;border-radius:7px;padding:6px 12px;color:var(--mt);font-size:12px;font-weight:500;white-space:nowrap;cursor:pointer;display:flex;align-items:center;gap:5px;transition:all .15s}
.nb:hover{color:var(--sub);border-color:var(--bd)}.nb.on{background:rgba(37,99,235,.15);border-color:rgba(37,99,235,.45);color:var(--bll);font-weight:700}
.btn{border:none;border-radius:7px;padding:8px 16px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap;transition:opacity .15s}
.btn:hover{opacity:.85}.btn:disabled{opacity:.4;cursor:not-allowed;pointer-events:none}
.bpri{background:linear-gradient(135deg,var(--bld),var(--bl));color:#fff;box-shadow:0 2px 8px rgba(37,99,235,.3)}
.bsuc{background:linear-gradient(135deg,#047857,var(--gnl));color:#fff}
.bdng{background:transparent;color:var(--rdl);border:1px solid var(--rdl)}
.bout{background:transparent;color:var(--bll);border:1px solid var(--bl)}
.bghs{background:transparent;color:var(--mt);border:1px solid var(--bd)}
.bwrn{background:linear-gradient(135deg,var(--or),var(--orl));color:#fff}
.bpur{background:linear-gradient(135deg,var(--pu),var(--pul));color:#fff}
.bsm{padding:5px 12px;font-size:12px}.bxs{padding:3px 9px;font-size:11px}
.card{background:var(--bg2);border:1px solid var(--bdl);border-radius:12px;padding:20px;margin-bottom:18px}
.cardt{font-size:11px;font-weight:700;color:var(--mt);letter-spacing:1.4px;text-transform:uppercase;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.inp{background:var(--bg0);border:1px solid var(--bdl);border-radius:7px;padding:8px 12px;color:var(--tx);font-size:13px;width:100%;outline:none;transition:border-color .15s}
.inp:focus{border-color:var(--bl);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
.isml{padding:6px 10px;font-size:12px}
textarea.inp{resize:vertical;min-height:70px}
.lbl{font-size:11px;color:var(--mt);letter-spacing:.8px;text-transform:uppercase;font-weight:700;margin-bottom:5px;display:block}
.fr{margin-bottom:14px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.86);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px}
.md{background:var(--bg2);border:1px solid var(--bdl);border-radius:14px;padding:28px;width:100%;max-width:600px;max-height:94vh;overflow-y:auto}
.mdlg{max-width:860px}
.mdh{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;padding-bottom:16px;border-bottom:1px solid var(--bd)}
.mdt{font-size:17px;font-weight:800}.mdc{background:none;border:none;color:var(--mt);font-size:22px;line-height:1;cursor:pointer}.mdc:hover{color:var(--tx)}
.tabs{display:flex;border-bottom:1px solid var(--bd);margin-bottom:18px}
.tabb{background:transparent;border:none;border-bottom:2px solid transparent;padding:9px 16px;font-size:13px;font-weight:500;color:var(--mt);cursor:pointer;white-space:nowrap}
.tabb.on{border-bottom-color:var(--bll);color:var(--bll);font-weight:700}
.badge{padding:3px 9px;border-radius:5px;font-size:11px;font-weight:700;border:1px solid;display:inline-flex;align-items:center;gap:3px}
.bxsm{padding:1px 6px;font-size:10px}
.led{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:10px;color:var(--mt);letter-spacing:1px;text-transform:uppercase;font-weight:700;padding:8px 10px;text-align:left;border-bottom:1px solid var(--bdl);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--bg3);font-size:12px;vertical-align:middle}
.tbl tbody tr:hover td{background:var(--bg3);cursor:pointer}
.sc{background:var(--bg2);border-radius:12px;padding:16px 20px;position:relative;overflow:hidden;border:1px solid var(--bdl)}
.sa{position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:4px 0 0 4px}
.sv{font-size:32px;font-weight:900;line-height:1;margin-bottom:4px}.sl{font-size:10px;color:var(--mt);letter-spacing:1.2px;text-transform:uppercase;font-weight:600}
.tlw{position:relative;padding-left:28px}.tlw::before{content:'';position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--bd)}
.tli{position:relative;margin-bottom:18px}
.tld{position:absolute;left:-24px;top:4px;width:14px;height:14px;border-radius:50%;border:2px solid var(--bg2)}
.tlb{background:var(--bg3);border:1px solid var(--bd);border-radius:9px;padding:12px 15px}
#lgw{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg0);padding:20px}
.lgb{background:var(--bg2);border:1px solid var(--bdl);border-radius:16px;padding:32px 28px;width:100%;max-width:440px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#toast{position:fixed;bottom:24px;right:24px;border-radius:9px;padding:11px 20px;font-size:13px;font-weight:600;z-index:9999;box-shadow:0 4px 24px rgba(0,0,0,.5);display:none;align-items:center;gap:8px;max-width:360px}
.alert{border-radius:9px;padding:12px 16px;margin-bottom:16px;display:flex;align-items:flex-start;gap:10px;font-size:13px}
.irow{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--bg3);border-radius:8px;margin-bottom:8px;font-size:13px}
.chkr{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;padding:4px 0}
.chkr input[type=checkbox]{width:15px;height:15px;cursor:pointer;accent-color:var(--gnl)}
.empty{text-align:center;padding:40px 20px;color:var(--mt)}
.pbar{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;margin-top:4px}
.pfil{height:100%;border-radius:3px}

/* ═══ MOBILE RESPONSIVE ═══ */
@media(max-width:700px){
  #bar{padding:0 12px;height:50px;gap:8px}
  #nav{display:none}
  #main{padding:14px}
  .g2,.g3{grid-template-columns:1fr}
  .tbl thead{display:none}
  .tbl tr{display:block;margin-bottom:10px;border:1px solid var(--bdl);border-radius:9px;padding:10px}
  .tbl td{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border:none;font-size:12px}
  .tbl td:before{content:attr(data-label);font-size:10px;color:var(--mt);font-weight:700;text-transform:uppercase;letter-spacing:.6px;flex-shrink:0;margin-right:8px}
  .md{padding:18px;max-height:96vh;border-radius:12px}
  .mdlg{max-width:100%}
  .tabs .tabb{padding:7px 10px;font-size:12px}
  .btn{font-size:12px;padding:7px 12px}
  .bsm{padding:5px 10px;font-size:11px}
  .bxs{padding:3px 7px;font-size:10px}
  /* Mobile nav bottom bar */
  #mob-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--bg1);border-top:1px solid var(--bdl);z-index:250;padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
  #mob-nav button{flex:1;background:transparent;border:none;color:var(--mt);font-size:10px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px}
  #mob-nav button .mi{font-size:18px}
  #mob-nav button.on{color:var(--bll)}
  #main{padding-bottom:72px}
  /* QR mobile page */
  .qr-mob-page{min-height:100vh;background:var(--bg0);padding:16px;padding-bottom:80px}
  .qr-eq-card{background:var(--bg2);border:1px solid var(--bdl);border-radius:14px;padding:18px;margin-bottom:14px}
  .qr-stat-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
  .qr-stat{background:var(--bg3);border-radius:9px;padding:12px;text-align:center}
  .qr-stat-v{font-size:24px;font-weight:900;line-height:1}
  .qr-stat-l{font-size:10px;color:var(--mt);text-transform:uppercase;letter-spacing:.8px;margin-top:3px}
}
@media(min-width:701px){
  #mob-nav{display:none}
}
/* QR landing page (any screen) */
#qr-landing{min-height:100vh;background:var(--bg0);display:flex;flex-direction:column}
.qr-top{background:var(--bg1);border-bottom:1px solid var(--bdl);padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:200}
.qr-body{flex:1;padding:16px;max-width:600px;margin:0 auto;width:100%;padding-bottom:80px}


/* QR Scanner Modal */
#qr-scanner-ov{position:fixed;inset:0;background:#000;z-index:600;display:flex;flex-direction:column}
#qr-scanner-bar{background:rgba(0,0,0,.7);padding:14px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0}
#qr-video-wrap{position:relative;flex:1;overflow:hidden;display:flex;align-items:center;justify-content:center}
#qr-video{width:100%;height:100%;object-fit:cover}
#qr-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.qr-frame{width:220px;height:220px;position:relative}
.qr-frame::before,.qr-frame::after{content:'';position:absolute;width:40px;height:40px;border-color:#22d3ee;border-style:solid}
.qr-frame::before{top:0;left:0;border-width:3px 0 0 3px;border-radius:4px 0 0 0}
.qr-frame::after{bottom:0;right:0;border-width:0 3px 3px 0;border-radius:0 0 4px 0}
.qr-corner-tr{position:absolute;top:0;right:0;width:40px;height:40px;border-top:3px solid #22d3ee;border-right:3px solid #22d3ee;border-radius:0 4px 0 0}
.qr-corner-bl{position:absolute;bottom:0;left:0;width:40px;height:40px;border-bottom:3px solid #22d3ee;border-left:3px solid #22d3ee;border-radius:0 0 0 4px}
.qr-scan-line{position:absolute;left:10px;right:10px;height:2px;background:linear-gradient(90deg,transparent,#22d3ee,transparent);animation:scan 2s ease-in-out infinite}
@keyframes scan{0%{top:10px}100%{top:200px}}
#qr-status{position:absolute;bottom:30px;left:0;right:0;text-align:center;font-size:13px;font-weight:600;color:#fff;background:rgba(0,0,0,.5);padding:8px;margin:0 20px;border-radius:8px}
</style>

function dbLoad(){
  try{

    var d=JSON.parse(r);
    if(!d.eqDocs)d.eqDocs={};
    if(!d.users)d.users=SEED.users;
    if(!d.schedule)d.schedule=SEED.schedule;
    if(!d.workOrders&&d.records)d.workOrders=d.records;
    if(!d.workOrders)d.workOrders=[];
    return d;
  }catch(e){return null;}
}

function bindLogin(){

    if(FLT.type!=='all'&&w.type!==FLT.type)return false;
    if(FLT.sev!=='all'&&w.sev!==FLT.sev)return false;
    if(FLT.status!=='all'&&w.status!==FLT.status)return false;
    if(FLT.q){var q=FLT.q.toLowerCase();var eq=DB.equipment.find(function(e){return e.id===w.eqId;});if(w.title.toLowerCase().indexOf(q)<0&&((eq&&eq.name)||'').toLowerCase().indexOf(q)<0&&w.id.toLowerCase().indexOf(q)<0)return false;}
    return true;
  });
}

// QR ENGINE
function makeQR(text,cell){
  cell=cell||8;
  var bytes=[];for(var i=0;i<text.length;i++){var c=text.charCodeAt(i);bytes.push(c<128?c:63);}
  var caps=[0,16,28,44,64,86,108,124,154,182,216];
  var ver=1;for(var i=1;i<caps.length;i++){if(bytes.length<=caps[i]){ver=i;break;}}
  var sz=17+4*ver;
  var M=[];for(var i=0;i<sz;i++){M.push(new Int8Array(sz).fill(-1));}
  function finder(r,c){for(var i=0;i<=6;i++)for(var j=0;j<=6;j++)M[r+i][c+j]=((i===0||i===6||j===0||j===6)||(i>=2&&i<=4&&j>=2&&j<=4))?1:0;}
  finder(0,0);finder(0,sz-7);finder(sz-7,0);
  for(var i=0;i<8;i++){[7,sz-8].forEach(function(p){if(M[p]&&M[p][i]<0)M[p][i]=0;if(M[i]&&M[i][p]<0)M[i][p]=0;});if(M[7]&&M[7][sz-8+i]<0)M[7][sz-8+i]=0;if(M[sz-8]&&M[sz-8][i]<0)M[sz-8][i]=0;}
  for(var i=8;i<sz-8;i++){if(M[6][i]<0)M[6][i]=i%2===0?1:0;if(M[i][6]<0)M[i][6]=i%2===0?1:0;}
  M[sz-8][8]=1;
  for(var i=0;i<=8;i++){if(M[8][i]<0)M[8][i]=0;if(M[i][8]<0)M[i][8]=0;}
  for(var i=0;i<=7;i++){if(M[8][sz-1-i]<0)M[8][sz-1-i]=0;if(M[sz-1-i][8]<0)M[sz-1-i][8]=0;}
  var bits=[];function addB(val,n){for(var i=n-1;i>=0;i--)bits.push((val>>i)&1);}
  addB(4,4);addB(bytes.length,8);bytes.forEach(function(b){addB(b,8);});addB(0,4);while(bits.length%8)bits.push(0);
  var pad=[236,17],pi=0,dcap=[0,16,28,44,64,86,108,124,154,182,216];
  while(bits.length<dcap[ver]*8){addB(pad[pi%2],8);pi++;}
  var gexp=new Uint8Array(512),glog=new Uint8Array(256);
  (function(){var x=1;for(var i=0;i<255;i++){gexp[i]=x;glog[x]=i;x<<=1;if(x&256)x^=285;}for(var i=255;i<512;i++)gexp[i]=gexp[i-255];})();
  function gm(a,b){return(a&&b)?gexp[(glog[a]+glog[b])%255]:0;}
  function gpMul(p,q){var r=new Uint8Array(p.length+q.length-1);for(var i=0;i<p.length;i++)for(var j=0;j<q.length;j++)r[i+j]^=gm(p[i],q[j]);return r;}
  function gpDiv(num,den){var r=new Uint8Array(num);for(var i=0;i<num.length-den.length+1;i++){var cv=r[i];if(!cv)continue;for(var j=1;j<den.length;j++)if(den[j])r[i+j]^=gm(den[j],cv);}return r.slice(num.length-den.length+1);}
  function gen(n){var g=[1];for(var i=0;i<n;i++)g=gpMul(g,[1,gexp[i]]);return g;}
  var ecn=[0,10,16,26,18,24,16,18,22,22,26];
  var data=[];for(var i=0;i<bits.length;i+=8){var b=0;for(var j=0;j<8;j++)b=(b<<1)|(bits[i+j]||0);data.push(b);}
  var ec=Array.from(gpDiv(new Uint8Array(data.concat(new Array(ecn[ver]).fill(0))),gen(ecn[ver])));
  var all=data.concat(ec);
  var mBits=[];all.forEach(function(b){for(var i=7;i>=0;i--)mBits.push((b>>i)&1);});mBits.push(0);
  var bi=0,up=true;
  for(var c=sz-1;c>=1;c-=2){if(c===6)c=5;for(var rr=0;rr<sz;rr++){var r=up?sz-1-rr:rr;for(var dc=0;dc<2;dc++){var col=c-dc;if(M[r][col]<0){M[r][col]=mBits[bi]||0;bi++;}}}up=!up;}
  for(var r=0;r<sz;r++)for(var c=0;c<sz;c++){if(M[r][c]<2&&M[r][c]>=0&&(r+c)%2===0)M[r][c]^=1;}
  var fs=0x5412,fb=[];for(var i=14;i>=0;i--)fb.push((fs>>i)&1);
  var fseq=[0,1,2,3,4,5,7,8];for(var i=0;i<8;i++){M[8][fseq[i]]=fb[i];M[fseq[i]][8]=fb[i];}
  for(var i=0;i<7;i++)M[sz-1-i][8]=fb[i];for(var i=0;i<8;i++)M[8][sz-8+i]=fb[14-i];M[sz-8][8]=1;
  var q=3,tot=(sz+q*2)*cell;
  var cvs=document.createElement('canvas');cvs.width=tot;cvs.height=tot;
  var ctx=cvs.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,tot,tot);ctx.fillStyle='#000';
  for(var r=0;r<sz;r++)for(var c=0;c<sz;c++)if(M[r][c]===1)ctx.fillRect((c+q)*cell,(r+q)*cell,cell,cell);
  return cvs;
}

  el.appendChild(makeQR(payload,8));
}catch(err){el.innerHTML='<div style="color:red;font-size:11px;padding:8px">Hata: '+esc(err.message)+'</div>';}}

function saveWO(){
  var eqId=v('f-eqid'),title=v('f-title').trim();

// POWERPOINT RAPOR OLUŞTURUCU
// ═══════════════════════════════════════════════
function generatePPTX() {
  if(typeof PptxGenJS === 'undefined') {
    toast('PowerPoint kütüphanesi yükleniyor, lütfen bekleyin...','warn');
    return;
  }

  var now = new Date();
  var monthNames = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
  var raporAy = monthNames[now.getMonth()];
  var raporYil = now.getFullYear();

  // Son 30 günü filtrele
  var cutoff = new Date(); cutoff.setDate(cutoff.getDate()-30);
  var cutoffStr = cutoff.toISOString().slice(0,10);
  var ayWOs = DB.workOrders.filter(function(w){ return w.date >= cutoffStr; });
  var tumWOs = DB.workOrders;

  // İstatistikler
  var totalWO = ayWOs.length;
  var openWO = ayWOs.filter(function(w){return w.status==='acik';}).length;
  var closedWO = ayWOs.filter(function(w){return w.status==='kapali';}).length;
  var devamWO = ayWOs.filter(function(w){return w.status==='devam';}).length;
  var gmpWO = ayWOs.filter(function(w){return w.gmp;}).length;
  var kritikWO = ayWOs.filter(function(w){return w.sev==='kritik';}).length;
  var totalLH = ayWOs.reduce(function(s,w){return s+(parseFloat(w.lh)||0);},0);
  var totalPC = ayWOs.reduce(function(s,w){return s+(parseFloat(w.pc)||0);},0);
  var compRate = totalWO > 0 ? Math.round(closedWO/totalWO*100) : 0;

  // MTTR
  var mttrArr = ayWOs.filter(function(w){return w.status==='kapali'&&w.type==='ariza'&&w.closedAt&&w.date;});
  var mttr = mttrArr.length ? (mttrArr.reduce(function(s,w){return s+(new Date(w.closedAt)-new Date(w.date))/3600000;},0)/mttrArr.length).toFixed(1) : 'N/A';

  // İş tipi dağılımı
  var typeCount = {};
  ayWOs.forEach(function(w){ typeCount[w.type]=(typeCount[w.type]||0)+1; });

  // Ekipman durumu
  var aktif = DB.equipment.filter(function(e){return e.status==='aktif';}).length;
  var arizali = DB.equipment.filter(function(e){return e.status==='arizali';}).length;
  var bakimda = DB.equipment.filter(function(e){return e.status==='bakimda';}).length;

  // GMP açık iş emirleri
  var gmpAcik = ayWOs.filter(function(w){return w.gmp&&w.status!=='kapali';});

  // Teknisyen performansı (son 30 gün)
  var techPerf = DB.technicians.filter(function(t){return t.active;}).map(function(t){
    var twos = ayWOs.filter(function(w){return w.techId===t.id;});
    var tclosed = twos.filter(function(w){return w.status==='kapali';}).length;
    return {name:t.name, role:t.role, total:twos.length, closed:tclosed, lh:twos.reduce(function(s,w){return s+(parseFloat(w.lh)||0);},0)};

  s7.addShape(pres.shapes.OVAL, {x:-1.5, y:3, w:4, h:4, fill:{color:C.teal, transparency:60}, line:{color:C.teal, transparency:60}});

  s7.addText('Sonraki Dönem Öncelikleri', {x:0.7, y:0.8, w:8.5, h:0.6, fontSize:24, bold:true, color:C.white, fontFace:'Calibri'});
  s7.addShape(pres.shapes.RECTANGLE, {x:0.7, y:1.5, w:1.0, h:0.05, fill:{color:C.teal2}, line:{color:C.teal2}});

  // Öncelikler: Açık iş emirleri + kritik bakımlar
  var bullets = [];
  // Açık kritik/yüksek iş emirleri
  var acikKrit = DB.workOrders.filter(function(w){return w.status!=='kapali'&&(w.sev==='kritik'||w.sev==='yuksek');}).slice(0,3);
  acikKrit.forEach(function(w){
    var eq = DB.equipment.find(function(e){return e.id===w.eqId;});
    bullets.push('['+((WTYPES[w.type]&&WTYPES[w.type].lbl)||w.type)+'] '+(eq?eq.name+': ':'')+w.title.slice(0,55));
  });
  // Yaklaşan kritik bakımlar
  var critMaint = DB.equipment.filter(function(e){var d=Math.ceil((new Date(e.nextMaint)-new Date())/86400000);return e.nextMaint&&d<=14&&d>=0;}).slice(0,3);
  critMaint.forEach(function(e){
    var d=Math.ceil((new Date(e.nextMaint)-new Date())/86400000);
    bullets.push('[Planlı Bakım] '+e.name+' — '+d+' gün içinde');
  });
  if(bullets.length === 0) bullets.push('Bu dönem tüm iş emirleri başarıyla tamamlandı.');

  var bulletItems = bullets.map(function(b, i){
    return {text:b, options:{bullet:true, breakLine:i<bullets.length-1, color:C.iceBlue, fontSize:12}};
  });
  s7.addText(bulletItems, {x:0.7, y:1.7, w:8.6, h:2.2, fontFace:'Calibri'});

  // Alt bilgi
  s7.addText(DB.settings.company + '  |  ' + DB.settings.facility + '  |  ' + raporAy + ' ' + raporYil, {x:0.7, y:4.9, w:8.5, h:0.3, fontSize:10, color:C.muted, fontFace:'Calibri'});

  // ═══════════════════════════
  // KAYDET
  // ═══════════════════════════
  var fileName = 'Bakim_Faaliyet_Raporu_' + raporAy + '_' + raporYil + '.pptx';
  pres.writeFile({fileName: fileName});
  toast('Sunum indiriliyor: ' + fileName);
}

var QR_EQ_ID = null;
var QR_TAB = 'info'; // info | workorders | new_wo

function showQRLanding(eqId) {

  app.innerHTML = renderQRLanding();

}

  if(!eq) return '<div id="qr-landing"><div class="qr-body" style="text-align:center;padding-top:60px"><div style="font-size:48px;margin-bottom:16px">❌</div><div style="font-size:18px;font-weight:700;color:var(--rdl)">Ekipman bulunamadı</div><div style="font-size:13px;color:var(--mt);margin-top:8px">ID: '+esc(QR_EQ_ID)+'</div><button class="btn bpri" style="margin-top:24px" onclick="U=null;R()">Ana Sayfaya Dön</button></div></div>';

  var wos = DB.workOrders.filter(function(w){ return w.eqId === eq.id; });
  var openWOs = wos.filter(function(w){ return w.status !== 'kapali'; });

  var dc = d===null?'var(--mt)':d<0?'var(--rdl)':d<=7?'var(--orl)':'var(--gnl)';

  var topbar = '<div class="qr-top">'

    + '<div style="flex:1"><div style="font-size:14px;font-weight:800;color:var(--tx)">'+esc(eq.name)+'</div><div style="font-size:10px;color:var(--mt)">'+esc(eq.id)+' · '+esc(eq.area)+'</div></div>'

    + '</div>'

  else if(QR_TAB === 'workorders') {

            + '</div>'

  }
  else if(QR_TAB === 'new_wo' || QR_TAB === 'edit_wo') {
    tabContent = renderQRWOForm(QR_TAB === 'edit_wo' ? QR_WO_EDIT : null);
  }

  return '<div id="qr-landing">'
    + topbar
    + '<div class="qr-body">'
    + statusCard
    + tabs
    + '<div id="qr-tab-content">'+tabContent+'</div>'
    + '</div>'
    + '<nav id="mob-nav">'
    + '<button class="" onclick="R()"><span class="mi">←</span>Ana Sayfa</button>'
    + '<button class="'+(QR_TAB==='info'?'on':'')+'" onclick="QR_TAB=\'info\';refreshQRTab()"><span class="mi">📋</span>Bilgiler</button>'

function refreshQRTab() {
  var eq = DB.equipment.find(function(e){return e.id===QR_EQ_ID;});
  // Update tab buttons
  var tabs = document.querySelectorAll('.tabs .tabb');
  var tabIds = ['info','workorders','new_wo'];
  tabs.forEach(function(tb,i){
    if(i<3) tb.className = 'tabb'+(QR_TAB===tabIds[i]?' on':'');
  });
  // Render content
  var el = document.getElementById('qr-tab-content');
  if(!el){showQRLanding(QR_EQ_ID);return;}
  // Re-render landing to update counters on tabs
  var app = document.getElementById('app');
  app.innerHTML = renderQRLanding();
  bindQRLanding();
}

function bindQRLanding() {
  // nothing extra needed — all via onclick attrs
}

function saveQRWO(editId) {
  var title = (document.getElementById('qf-title')||{value:''}).value.trim();
  if(!title){toast('Başlık zorunludur','err');return;}
  var status = (document.getElementById('qf-status')||{value:'acik'}).value;
  var ex = editId ? DB.workOrders.find(function(w){return w.id===editId;}) : null;
  var wo = {
    id: ex ? ex.id : 'WO-'+uid(),
    eqId: QR_EQ_ID,
    type: (document.getElementById('qf-type')||{value:'ariza'}).value || 'ariza',
    title: title,
    desc: (document.getElementById('qf-desc')||{value:''}).value || '',
    sev:  (document.getElementById('qf-sev')||{value:'orta'}).value || 'orta',
    status: status,
    date: (document.getElementById('qf-date')||{value:today()}).value || today(),
    due:  (document.getElementById('qf-due')||{value:''}).value || '',
    techId: (document.getElementById('qf-tech')||{value:''}).value || '',
    gmp: (document.getElementById('qf-gmp')||{checked:false}).checked || false,
    root: (document.getElementById('qf-root')||{value:''}).value || '',
    lh: parseFloat((document.getElementById('qf-lh')||{value:0}).value)||0,
    pc: parseFloat((document.getElementById('qf-pc')||{value:0}).value)||0,
    steps: ex ? ex.steps : [],
    docs: ex ? ex.docs : [],
    comments: ex ? ex.comments : [],
    by: ex ? ex.by : U.id,
    approvedBy: ex ? ex.approvedBy : '',
    closedAt: (status==='kapali' && !(ex&&ex.closedAt)) ? nowStr() : (ex ? ex.closedAt||'' : ''),
  };
  // Auto-set equipment status for critical failures
  if(wo.type==='ariza' && wo.sev==='kritik' && wo.status==='acik'){
    DB.equipment = DB.equipment.map(function(e){return e.id===QR_EQ_ID?Object.assign({},e,{status:'arizali'}):e;});
  }
  if(status==='kapali'){
    DB.equipment = DB.equipment.map(function(e){
      if(e.id===QR_EQ_ID && e.status==='arizali') return Object.assign({},e,{status:'aktif',lastMaint:today()});
      return e;
    });
  }
  if(ex) DB.workOrders = DB.workOrders.map(function(w){return w.id===wo.id?wo:w;});
  else DB.workOrders = [wo].concat(DB.workOrders);
  dbSave();
  QR_WO_EDIT = null;
  QR_TAB = 'workorders';
  toast(ex?'İş emri güncellendi':'İş emri oluşturuldu');
  showQRLanding(QR_EQ_ID);
}

function closeWOQR(woId) {
  if(!confirm('Bu iş emrini kapatmak istiyor musunuz?')) return;
  DB.workOrders = DB.workOrders.map(function(w){
    return w.id===woId ? Object.assign({},w,{status:'kapali',closedAt:nowStr()}) : w;
  });
  // If no more open WOs on this equipment, set to active
  var eq = DB.equipment.find(function(e){return e.id===QR_EQ_ID;});
  var stillOpen = DB.workOrders.filter(function(w){return w.eqId===QR_EQ_ID&&w.status!=='kapali';}).length;
  if(eq && eq.status==='arizali' && stillOpen===0){
    DB.equipment = DB.equipment.map(function(e){return e.id===QR_EQ_ID?Object.assign({},e,{status:'aktif',lastMaint:today()}):e;});
  }
  dbSave();
  toast('İş emri kapatıldı');
  showQRLanding(QR_EQ_ID);
}

function approveWOQR(woId) {
  if(!confirm('Bu iş emrini onaylayıp kapatmak istiyor musunuz?')) return;
  DB.workOrders = DB.workOrders.map(function(w){
    return w.id===woId ? Object.assign({},w,{status:'kapali',approvedBy:U.id,closedAt:nowStr()}) : w;
  });
  var stillOpen = DB.workOrders.filter(function(w){return w.eqId===QR_EQ_ID&&w.status!=='kapali';}).length;
  if(stillOpen===0){
    DB.equipment = DB.equipment.map(function(e){return e.id===QR_EQ_ID?Object.assign({},e,{status:'aktif',lastMaint:today()}):e;});
  }
  dbSave();
  toast('İş emri onaylandı ve kapatıldı');
  showQRLanding(QR_EQ_ID);
}

  var html = '<div id="qr-scanner-ov">'
    + '<div id="qr-scanner-bar">'
    + '<button onclick="closeQRScanner()" style="background:none;border:none;color:#fff;font-size:26px;cursor:pointer;line-height:1">←</button>'
    + '<div style="flex:1"><div style="font-size:15px;font-weight:700;color:#fff">QR Kod Tara</div><div style="font-size:11px;color:rgba(255,255,255,.6)">Kamerayı QR koda gösterin</div></div>'
    + '</div>'
    + '<div id="qr-video-wrap">'
    + '<video id="qr-video" autoplay playsinline muted></video>'
    + '<div id="qr-overlay"><div class="qr-frame"><div class="qr-corner-tr"></div><div class="qr-corner-bl"></div><div class="qr-scan-line"></div></div></div>'
    + '<div id="qr-status">QR kodu çerçeve içine alın</div>'
    + '</div>'
    + '</div>';

  document.body.insertAdjacentHTML('beforeend', html);

  // Kamera başlat
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    document.getElementById('qr-status').textContent = '❌ Kamera desteklenmiyor';
    return;
  }

  navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false})
    .then(function(stream) {
      _qrStream = stream;
      var video = document.getElementById('qr-video');
      if(!video) return;
      video.srcObject = stream;
      video.addEventListener('loadedmetadata', function() {
        video.play();
        _qrCanvas = document.createElement('canvas');
        _qrCtx = _qrCanvas.getContext('2d');
        requestAnimationFrame(scanFrame);
      });
    })
    .catch(function(err) {
      var msg = err.name === 'NotAllowedError'
        ? '❌ Kamera izni reddedildi. Tarayıcı ayarlarından izin verin.'
        : '❌ Kamera açılamadı: ' + err.message;
      var st = document.getElementById('qr-status');
      if(st) st.textContent = msg;
    });
}

function scanFrame() {
  var video = document.getElementById('qr-video');
  if(!video || !_qrCanvas || !_qrCtx || !document.getElementById('qr-scanner-ov')) return;

  if(video.readyState === video.HAVE_ENOUGH_DATA) {
    _qrCanvas.width  = video.videoWidth;
    _qrCanvas.height = video.videoHeight;
    _qrCtx.drawImage(video, 0, 0, _qrCanvas.width, _qrCanvas.height);
    var imageData = _qrCtx.getImageData(0, 0, _qrCanvas.width, _qrCanvas.height);

    if(typeof jsQR !== 'undefined') {
      var code = jsQR(imageData.data, imageData.width, imageData.height, {inversionAttempts:'dontInvert'});
      if(code && code.data) {
        handleQRResult(code.data);
        return; // stop scanning
      }
    } else {
      var st = document.getElementById('qr-status');
      if(st) st.textContent = '⏳ jsQR kütüphanesi yükleniyor...';
    }
  }

  _qrAnimId = requestAnimationFrame(scanFrame);
}

function handleQRResult(data) {
  closeQRScanner();

  // Desteklenen format: PHARMA_MS:EQ-001
  var eqId = null;
  // Format 1: PHARMA_MS:EQ-001 (kısa)
  if(data.startsWith('PHARMA_MS:')) {
    eqId = data.replace('PHARMA_MS:','').trim();
  }
  // Format 2: https://...?eq=EQ-001 (yeni URL format)
  if(!eqId) {
    var qMatch = data.match(/[?&]eq=([A-Z0-9\-]+)/);
    if(qMatch) eqId = qMatch[1];
  }
  // Format 3: URL içinde #qr=EQ-001 (eski format fallback)
  if(!eqId) {
    var hashMatch = data.match(/#qr=([A-Z0-9\-]+)/);
    if(hashMatch) eqId = hashMatch[1];
  }

  if(!eqId) {
    toast('Tanınmayan QR kodu: ' + data.slice(0,30), 'warn');
    return;
  }

  var eq = DB.equipment.find(function(e){ return e.id === eqId; });
  if(!eq) {
    toast('Ekipman bulunamadı: ' + eqId, 'err');
    return;
  }

  toast('✓ ' + eq.name + ' — QR okundu', 'ok');
  QR_EQ_ID = eqId;
  QR_TAB = 'info';
  showQRLanding(eqId);
}

function closeQRScanner() {
  if(_qrAnimId) { cancelAnimationFrame(_qrAnimId); _qrAnimId = null; }
  if(_qrStream)  { _qrStream.getTracks().forEach(function(t){t.stop();}); _qrStream = null; }
  var el = document.getElementById('qr-scanner-ov');
  if(el) el.remove();
  _qrCanvas = null; _qrCtx = null;
}

// BOOT
// QR link ile gelindiyse (?eq=EQ-001)
(function(){
  var qParam = typeof URLSearchParams !== 'undefined'
    ? new URLSearchParams(window.location.search).get('eq')
    : null;
  if(qParam) {
    // Önce login, sonra QR sayfasına yönlendir
    window._pendingQR = qParam;
  }
})();
R();
