function pgWaterSystem(){
  var plans = DB.waterPlans || [];

  // Takvim ayı
  var parts  = WS_CAL_DATE.split('-');
  var year   = parseInt(parts[0]);
  var month  = parseInt(parts[1])-1; // 0-indexed
  var monthNames=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
  var dayNames  =['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];

  // Bu ayın planları
  var monthStr = WS_CAL_DATE;
  var monthPlans = plans.filter(function(p){return p.date&&p.date.startsWith(monthStr);});

  // İstatistikler
  var total = plans.length;
  var done  = plans.filter(function(p){return p.status==='tamamlandi';}).length;
  var late  = plans.filter(function(p){
    // Durumu 'gecikti' olan VEYA planlanmış ama tarihi geçmiş
    return p.status==='gecikti' ||
           (p.status==='planli' && p.date && p.date < today());
  }).length;

  var maxNo=plans.length>0?Math.max.apply(null,plans.map(function(p){return parseInt(p.no||0)||0;})):0;
  var statsH = [
    {lbl:'Toplam Is (#'+maxNo+')',v:total,col:'var(--bll)'},
    {lbl:'Tamamlanan',            v:done, col:'var(--gnl)'},
    {lbl:'Geciken',               v:late, col:'var(--rdl)'},
  ].map(function(s){
    return '<div class="sc" style="border-color:'+s.col+'25">'
      +'<div class="sa" style="background:'+s.col+'"></div>'
      +'<div class="sv" style="color:'+s.col+'">'+s.v+'</div>'
      +'<div class="sl">'+s.lbl+'</div></div>';
  }).join('');

  // Takvim
  var firstDay = new Date(year, month, 1);
  var lastDay  = new Date(year, month+1, 0);
  var startDow = (firstDay.getDay()+6)%7; // Pazartesi=0
  var todayStr = today();

  // Gün başlıkları
  var calHeader = dayNames.map(function(d){
    return '<div style="text-align:center;font-size:11px;font-weight:700;color:var(--mt);padding:6px 0">'+d+'</div>';
  }).join('');

  // Takvim hücreleri
  var cells = '';
  // Boş hücreler
  for(var i=0;i<startDow;i++) cells+='<div></div>';
  // Günler
  for(var day=1;day<=lastDay.getDate();day++){
    var dateStr = year+'-'+(month<9?'0':'')+(month+1)+'-'+(day<10?'0':'')+day;
    var dayPlans = plans.filter(function(p){return p.date===dateStr;});
    var isToday  = dateStr===todayStr;
    var isSel    = dateStr===WS_SEL_DATE;
    var hasPlan  = dayPlans.length>0;
    var isPast   = dateStr < todayStr;
    // En kritik durumu al
    var cellStatus = dayPlans.length>0 ? dayPlans.reduce(function(acc,p){
      if(p.status==='gecikti') return 'gecikti';
      if(p.status==='planli'&&acc!=='gecikti') return 'planli';
      if(p.status==='tamamlandi'&&acc==='') return 'tamamlandi';
      return acc;
    },'') : '';
    var dotColor = cellStatus ? getWaterStatuses()[cellStatus].col : '';
    cells += '<div onclick="WS_SEL_DATE=\''+dateStr+'\';renderPage()" style="'
      +'min-height:52px;padding:4px;border-radius:8px;cursor:pointer;border:2px solid '
      +(isSel?'var(--bll)':isToday?'rgba(79,142,247,.4)':'transparent')+';'
      +'background:'+(isSel?'rgba(79,142,247,.1)':isToday?'rgba(79,142,247,.05)':'var(--bg3)')+';'
      +'transition:all .1s">'
      +'<div style="font-size:12px;font-weight:'+(isToday?'800':'600')+';color:'+(isToday?'var(--bll)':isPast?'var(--mt)':'var(--tx)')+';text-align:center">'+day+'</div>'
      +(hasPlan?'<div style="display:flex;flex-wrap:wrap;gap:2px;margin-top:3px;justify-content:center">'
        +dayPlans.slice(0,3).map(function(p){
          var wt=WATER_TYPES.find(function(w){return w.id===p.typeId;})||{col:'#888'};
          var sc=getWaterStatuses()[p.status]||{col:'#888'};
          return '<div style="width:8px;height:8px;border-radius:50%;background:'+sc.col+'" title="'+esc((WATER_TYPES.find(function(w){return w.id===p.typeId;})||{lbl:''}).lbl)+'"></div>';
        }).join('')
        +(dayPlans.length>3?'<div style="font-size:9px;color:var(--mt)">+'+( dayPlans.length-3)+'</div>':'')
        +'</div>':'')
      +'</div>';
  }

  // Seçili gün detayı
  var selDayH = '';
  if(WS_SEL_DATE){

function wsPrevMonth(){
  var parts=WS_CAL_DATE.split('-');
  var y=parseInt(parts[0]),m=parseInt(parts[1]);
  m--; if(m<1){y--;m=12;}
  WS_CAL_DATE=y+'-'+(m<10?'0':'')+m;
  WS_SEL_DATE=null; renderPage();
}
function wsNextMonth(){
  var parts=WS_CAL_DATE.split('-');
  var y=parseInt(parts[0]),m=parseInt(parts[1]);
  m++; if(m>12){y++;m=1;}
  WS_CAL_DATE=y+'-'+(m<10?'0':'')+m;
  WS_SEL_DATE=null; renderPage();
}
function wsPrevYear(){
  var parts=WS_CAL_DATE.split('-');
  WS_CAL_DATE=(parseInt(parts[0])-1)+'-'+parts[1];
  WS_SEL_DATE=null; renderPage();
}
function wsNextYear(){
  var parts=WS_CAL_DATE.split('-');
  WS_CAL_DATE=(parseInt(parts[0])+1)+'-'+parts[1];
  WS_SEL_DATE=null; renderPage();
}
var WS_SHOW_PICKER=false;
function wsTogglePicker(){WS_SHOW_PICKER=!WS_SHOW_PICKER;renderPage();}
function wsGotoMonth(ym){WS_CAL_DATE=ym;WS_SEL_DATE=null;WS_SHOW_PICKER=false;renderPage();}

function wsOpenNew(date){
  if(!can('w')){toast('Yetki yok','err');return;}
  WS_EDIT=null;
  WS_SEL_DATE=date||WS_SEL_DATE;
  WS_MODAL=true;
  renderModals();
}
function wsOpenEdit(id){
  if(!can('w')){toast('Yetki yok','err');return;}
  WS_EDIT=(DB.waterPlans||[]).find(function(p){return p.id===id;})||null;
  WS_MODAL=true;
  renderModals();
}
function wsDel(id){
  if(!can('d')){toast('Yetki yok','err');return;}
  var p=(DB.waterPlans||[]).find(function(x){return x.id===id;});
  if(!p||!confirm('Bu planı silmek istiyor musunuz?'))return;
  DB.waterPlans=DB.waterPlans.filter(function(x){return x.id!==id;});
  addLog('Su Sistemi Plan Silindi',p.date,'','');
  dbSave();renderPage();
}

function wsSave(){
  var date  =(document.getElementById('ws-date')||{value:''}).value;
  var typeId=(document.getElementById('ws-type')||{value:''}).value;
  if(!date){toast('Tarih seçiniz','err');return;}
  if(!typeId){toast('İşlem türü seçiniz','err');return;}
  var wsAll=DB.waterPlans||[];
  var nextNo=wsAll.length>0?Math.max.apply(null,wsAll.map(function(p){return parseInt(p.no||0)||0;}))+1:1;
  // Teknisyen plan oluşturursa bekliyor_onay, mühendis/yönetici direkt planli
  var newStRaw=(document.getElementById('ws-status')||{value:'planli'}).value||'planli';
  var newSt=(!WS_EDIT && !can('ap') && newStRaw==='planli') ? 'bekliyor_onay' : newStRaw;
  var oldP=WS_EDIT||{};
  var plan={
    id:      WS_EDIT?WS_EDIT.id:'WP-'+uid(),
    no:      WS_EDIT?(WS_EDIT.no||nextNo):nextNo,
    date:    date,
    typeId:  typeId,
    techId:  (document.getElementById('ws-tech')||{value:''}).value||'',
    status:  newSt,
    notes:   (document.getElementById('ws-notes')||{value:''}).value.trim(),
    closedAt:(newSt==='tamamlandi'||newSt==='iptal')?(oldP.closedAt||(document.getElementById('ws-closedate')&&document.getElementById('ws-closedate').value?document.getElementById('ws-closedate').value:today())):'',
    closedBy:(newSt==='tamamlandi'||newSt==='iptal')?(oldP.closedBy||(U?U.name:'')):'',
  };
  if(!DB.waterPlans)DB.waterPlans=[];
  if(WS_EDIT)DB.waterPlans=DB.waterPlans.map(function(p){return p.id===plan.id?plan:p;});
  else DB.waterPlans=DB.waterPlans.concat([plan]);
  WS_SEL_DATE=date; // Kaydedilen tarihi seç
  addLog('Su Sistemi '+(WS_EDIT?'Plan Güncellendi':'Plan Eklendi'),date+' — '+(WATER_TYPES.find(function(w){return w.id===typeId;})||{lbl:typeId}).lbl,'','');
  dbSave();wsCloseModal();renderPage();
  toast(WS_EDIT?'Plan güncellendi':'Plan eklendi ✓');
}

function wsCloseByModal(){
  var planId=(document.getElementById('wsc-plan')||{value:''}).value;
  var ns=(document.getElementById('wsc-status')||{value:''}).value;
  var closeDate=(document.getElementById('wsc-date')||{value:''}).value||today();
  var notes=(document.getElementById('wsc-notes')||{value:''}).value.trim();
  if(!planId){toast('İş seçiniz','err');return;}
  if(!ns){toast('Durum seçiniz','err');return;}
  var plan=(DB.waterPlans||[]).find(function(p){return p.id===planId;});
  if(!plan){toast('Plan bulunamadı','err');return;}
  var WS2=getWaterStatuses();
  var stLbl=(WS2[ns]&&WS2[ns].lbl)||ns;
  DB.waterPlans=DB.waterPlans.map(function(p){
    if(p.id!==planId)return p;
    return Object.assign({},p,{status:ns,closedAt:closeDate,closedBy:U?U.name:'',closeNotes:notes});
  });

function wsStatusAdd(){

  var lbl=(document.getElementById('ws-new-lbl')||{value:''}).value.trim();
  var col=(document.getElementById('ws-new-col')||{value:'#4f8ef7'}).value||'#4f8ef7';

  if(!DB.waterStatuses)DB.waterStatuses=[];

  }
  var id=lbl.toLowerCase().replace(/[^a-z0-9]/g,'_').substring(0,20)+'_'+Date.now().toString(36);
  DB.waterStatuses.push({id:id,lbl:lbl,col:col});

  toast('Durum eklendi: '+lbl);

function wsStatusEdit(idx){
  if(!can('s')){toast('Yönetici yetkisi gerekli','err');return;}
  var lbl=(document.getElementById('ws-lbl-'+idx)||{value:''}).value.trim();
  var col=(document.getElementById('ws-col-'+idx)||{value:'#888'}).value||'#888';

  addLog('Su Sistemi Durum Güncellendi',old+' → '+lbl,'','');
  dbSave();
  toast('Durum güncellendi');
  renderPage();

function wsStatusSave(idx){
  if(!can('s')){toast('Yönetici yetkisi gerekli','err');return;}
  var lbl=(document.getElementById('wsl-'+idx)||{value:''}).value.trim();
  var col=(document.getElementById('wsc-'+idx)||{value:'#4f8ef7'}).value||'#4f8ef7';
  if(!lbl){toast('Durum adı boş olamaz','err');return;}
  if(!DB.waterStatuses||!DB.waterStatuses[idx]){toast('Durum bulunamadı','err');return;}
  var oldLbl=DB.waterStatuses[idx].lbl;
  DB.waterStatuses[idx].lbl=lbl;
  DB.waterStatuses[idx].col=col;
  addLog('Su Sistemi Durum Güncellendi',oldLbl+' → '+lbl,'','');

function wsStatusDel(idx){
  if(!can('s')){toast('Yönetici yetkisi gerekli','err');return;}
  if(!DB.waterStatuses||!DB.waterStatuses[idx]){return;}
  var s=DB.waterStatuses[idx];
  // Bu durumu kullanan plan var mı?
  var inUse=(DB.waterPlans||[]).filter(function(p){return p.status===s.id;}).length;
  if(inUse>0){
    if(!confirm(s.lbl+' durumunda '+inUse+' plan var. Yine de silmek istiyor musunuz?'))return;
  } else {
    if(!confirm(s.lbl+' durumunu silmek istiyor musunuz?'))return;
  }
  DB.waterStatuses.splice(idx,1);
  addLog('Su Sistemi Durum Silindi',s.lbl,'','');
  dbSave();
  toast(s.lbl+' silindi','warn');
  renderPage();

// QR LOGIN REDIRECT HARD FIX v4
// Amaç: QR ile gelinen eq bilgisini login sonrası kaybetmemek.
// localStorage + sessionStorage + URL üçlüsünden okur; ana sayfaya düşmeyi engeller.
// ══════════════════════════════════════════════════════════════
function qrCaptureTarget(){
  var eq='', tab='workorders';
  try{
    var up=new URLSearchParams(window.location.search||'');
    eq=up.get('eq')||'';
    tab=up.get('tab')||up.get('page')||tab;
  }catch(e){}
  try{
    var h=window.location.hash||'';
    if(!eq && h.indexOf('#qr=')===0) eq=decodeURIComponent(h.replace('#qr=',''));
  }catch(e){}
  if(eq){
    eq=normalizeQREqId(eq);
    if(tab==='wo'||tab==='workorder'||tab==='is-emri'||tab==='workorders') tab='workorders';
    if(tab==='new'||tab==='new_wo') tab='new_wo';
    try{sessionStorage.setItem('pendingQR',eq);sessionStorage.setItem('pendingQRTab',tab);}catch(e){}
    try{localStorage.setItem('pharma_qr_target',JSON.stringify({eq:eq,tab:tab,ts:Date.now()}));}catch(e){}
    window._pendingQR=eq; QR_PENDING_TAB=tab;
  }
}
function qrReadTarget(){
  qrCaptureTarget();
  var eq=window._pendingQR||'';
  var tab=QR_PENDING_TAB||'workorders';
  try{eq=eq||sessionStorage.getItem('pendingQR')||'';tab=sessionStorage.getItem('pendingQRTab')||tab;}catch(e){}
  try{
    var r=localStorage.getItem('pharma_qr_target');
    if(r){
      var o=JSON.parse(r);
      if(o && o.eq && (Date.now()-(o.ts||0)<24*60*60*1000)){eq=eq||o.eq;tab=o.tab||tab;}
    }
  }catch(e){}
  if(!eq)return null;
  eq=normalizeQREqId(eq);
  if(tab==='wo'||tab==='workorder'||tab==='is-emri')tab='workorders';
  if(tab==='new'||tab==='new_wo')tab='new_wo';
  return {eq:eq,tab:tab||'workorders'};
}
function qrClearTarget(){
  window._pendingQR=null;
  try{sessionStorage.removeItem('pendingQR');sessionStorage.removeItem('pendingQRTab');}catch(e){}
  try{localStorage.removeItem('pharma_qr_target');}catch(e){}
}
function qrForceOpenTarget(){
  var t=qrReadTarget();
  if(!t||!t.eq)return false;
  showPendingRedirect('Ekipman iş emirleri açılıyor');
  var count=0;
  (function waitEq(){
    count++;
    var eqFound=(DB.equipment||[]).find(function(x){return String(x.id).toUpperCase()===String(t.eq).toUpperCase();});
    if(eqFound){
      qrClearTarget();
      QR_ACTIVE=true;
      showQRLanding(eqFound.id,t.tab||'workorders');
      return;
    }
    if(count<25){setTimeout(waitEq,200);return;}
    // Ekipman bulunamazsa ana sayfaya düşürme, QR hata ekranında kal.
    qrClearTarget();
    QR_ACTIVE=true;
    showQRLanding(t.eq,t.tab||'workorders');
  })();
  return true;
}



// ══════════════════════════════════════════════════════════════
// SPARE PART QR LOGIN REDIRECT HARD FIX v1
// Amaç: Yedek parça QR (?sp=...) ile gelindiğinde login sonrası ana sayfaya düşmeden
// direkt ilgili yedek parça stok giriş/çıkış ekranını açmak.
// localStorage + sessionStorage + URL üçlüsünden okur.
// ══════════════════════════════════════════════════════════════
function normalizeSPId(v){
  if(!v) return '';
  v=String(v).trim();
  if(v.indexOf('PHARMA_SP:')===0) v=v.replace('PHARMA_SP:','').trim();
  if(v.indexOf('SPARE:')===0) v=v.replace('SPARE:','').trim();
  try{
    if(v.indexOf('http')===0){
      var u=new URL(v);
      v=u.searchParams.get('sp')||u.searchParams.get('part')||u.searchParams.get('spare')||u.searchParams.get('code')||v;
    }
  }catch(e){}
  return String(v).trim();
}
function spCaptureTarget(){
  var sp='';
  try{
    var up=new URLSearchParams(window.location.search||'');
    sp=up.get('sp')||up.get('part')||up.get('spare')||up.get('code')||'';
  }catch(e){}
  try{
    var h=window.location.hash||'';
    if(!sp && h.indexOf('#sp=')===0) sp=decodeURIComponent(h.replace('#sp=',''));
    if(!sp && h.indexOf('#part=')===0) sp=decodeURIComponent(h.replace('#part=',''));
  }catch(e){}
  if(sp){
    sp=normalizeSPId(sp);
    try{sessionStorage.setItem('pendingSP',sp);}catch(e){}
    try{localStorage.setItem('pharma_sp_target',JSON.stringify({sp:sp,ts:Date.now()}));}catch(e){}
    window._pendingSP=sp;
  }
}
function spReadTarget(){
  spCaptureTarget();
  var sp=window._pendingSP||'';
  try{sp=sp||sessionStorage.getItem('pendingSP')||'';}catch(e){}
  try{
    var r=localStorage.getItem('pharma_sp_target');
    if(r){
      var o=JSON.parse(r);
      if(o && o.sp && (Date.now()-(o.ts||0)<24*60*60*1000)) sp=sp||o.sp;
    }
  }catch(e){}
  return sp?normalizeSPId(sp):null;
}
function spClearTarget(){
  window._pendingSP=null;
  try{sessionStorage.removeItem('pendingSP');}catch(e){}
  try{localStorage.removeItem('pharma_sp_target');}catch(e){}
}
function findSparePartByQRId(sp){
  var n=normalizeSPId(sp);
  var nu=String(n).toUpperCase();
  return (DB.spareParts||[]).find(function(x){
    return String(x.id||'').toUpperCase()===nu || String(x.code||'').toUpperCase()===nu;
  });
}
function showSparePendingRedirect(){
  var app=document.getElementById('app');
  app.innerHTML='<div id="qr-landing"><div class="qr-body" style="text-align:center;padding-top:70px">'
    +'<div style="font-size:42px;margin-bottom:14px">🔩</div>'
    +'<div style="font-size:18px;font-weight:800;color:var(--tx)">Yedek parça ekranı açılıyor</div>'
    +'<div style="font-size:13px;color:var(--mt);margin-top:8px">Giriş başarılı. QR ile okutulan parçanın stok ekranı hazırlanıyor...</div>'
    +'</div></div>';
}
function spForceOpenTarget(){
  var sp=spReadTarget();
  if(!sp) return false;
  showSparePendingRedirect();
  var count=0;
  (function waitSp(){
    count++;
    var found=findSparePartByQRId(sp);
    if(found){
      spClearTarget();
      QR_ACTIVE=true;
      showSpareQRLanding(found.id);
      return;
    }
    if(count<40){setTimeout(waitSp,200);return;}
    // Parça bulunamazsa ana sayfaya düşürme; kullanıcıya hatayı QR ekranında göster.
    QR_ACTIVE=true;
    var app=document.getElementById('app');
    app.innerHTML='<div id="qr-landing"><div class="qr-top"><button onclick="spClearTarget();PAGE=\'spareparts\';R()" style="background:none;border:none;color:var(--mt);font-size:22px;cursor:pointer">←</button><div style="font-size:14px;font-weight:800">Yedek Parça Bulunamadı</div></div>'
      +'<div class="qr-body"><div class="alert" style="background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25)"><span>⚠</span><div>QR kodundaki yedek parça sistemde bulunamadı: <b>'+esc(sp)+'</b><br><br>Parça ID veya parça kodu ile sistemdeki kayıt aynı olmalıdır.</div></div>'
      +'<button class="btn bpri" onclick="spClearTarget();PAGE=\'spareparts\';R()">Yedek Parça Listesine Git</button></div></div>';
  })();
  return true;
}
// Mevcut R fonksiyonunu bozmadan yedek parça QR yönlendirmesini en üste al.
var __R_WITHOUT_SP_REDIRECT = R;
R = function(){
  spCaptureTarget();

// SPARE PART QR LOGIN REDIRECT HARD FIX v2
// Login sonrası ana sayfaya düşmeyi engelleyen nihai yönlendirme.
// URL + sessionStorage + localStorage üzerinden yedek parça QR hedefini korur.
// ══════════════════════════════════════════════════════════════
(function(){
  function _spGetFromUrl(){
    var sp='';
    try{
      var u=new URL(window.location.href);
      sp=u.searchParams.get('sp')||u.searchParams.get('part')||u.searchParams.get('spare')||u.searchParams.get('code')||'';
      if(!sp && u.hash){
        var h=u.hash.replace(/^#/, '');
        if(h.indexOf('sp=')===0) sp=decodeURIComponent(h.slice(3));
        if(h.indexOf('part=')===0) sp=decodeURIComponent(h.slice(5));
      }
    }catch(e){}
    return sp;
  }
  function _spStore(sp){
    if(!sp)return;
    sp=(typeof normalizeSPId==='function')?normalizeSPId(sp):String(sp).trim();
    window._pendingSP=sp;
    try{sessionStorage.setItem('pendingSP',sp);}catch(e){}
    try{localStorage.setItem('pharma_sp_target',JSON.stringify({sp:sp,ts:Date.now()}));}catch(e){}
  }
  window.spCaptureTarget=function(){
    var sp=_spGetFromUrl();
    if(sp)_spStore(sp);
  };
  window.spReadTarget=function(){
    var sp=_spGetFromUrl()||window._pendingSP||'';
    try{sp=sp||sessionStorage.getItem('pendingSP')||'';}catch(e){}
    try{
      var r=localStorage.getItem('pharma_sp_target');
      if(r){var o=JSON.parse(r);if(o&&o.sp&&(Date.now()-(o.ts||0)<86400000))sp=sp||o.sp;}
    }catch(e){}
    return sp?((typeof normalizeSPId==='function')?normalizeSPId(sp):String(sp).trim()):null;
  };
  window.spClearTarget=function(){
    window._pendingSP=null;
    try{sessionStorage.removeItem('pendingSP');}catch(e){}
    try{localStorage.removeItem('pharma_sp_target');}catch(e){}
  };
  window.findSparePartByQRId=function(sp){
    var n=(typeof normalizeSPId==='function')?normalizeSPId(sp):String(sp||'').trim();
    var nu=String(n).toUpperCase();
    return (DB.spareParts||[]).find(function(x){
      return String(x.id||'').toUpperCase()===nu || String(x.code||'').toUpperCase()===nu;
    });
  };
  window.spForceOpenTarget=function(){
    var sp=spReadTarget();
    if(!sp)return false;
    if(!U){_spStore(sp);return false;}
    QR_ACTIVE=true;
    showSparePendingRedirect();
    var tries=0;
    (function wait(){
      tries++;
      var found=findSparePartByQRId(sp);

      if(tries<60){setTimeout(wait,200);return;}
      var app=document.getElementById('app');
      if(app){app.innerHTML='<div id="qr-landing"><div class="qr-top"><button onclick="spClearTarget();PAGE=\'spareparts\';R()" style="background:none;border:none;color:var(--mt);font-size:22px;cursor:pointer">←</button><div style="font-size:14px;font-weight:800">Yedek Parça Bulunamadı</div></div><div class="qr-body"><div class="alert" style="background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25)"><span>⚠</span><div>QR kodundaki yedek parça sistemde bulunamadı: <b>'+esc(sp)+'</b><br><br>Parça ID veya stok kodu ile sistemdeki kayıt aynı olmalıdır.</div></div><button class="btn bpri" onclick="spClearTarget();PAGE=\'spareparts\';R()">Yedek Parça Listesine Git</button></div></div>';}
    })();
    return true;
  };
  spCaptureTarget();
})();

function setScore(n){
  var el=document.getElementById('sc-point');
  if(el)el.value=n;
  document.querySelectorAll('#ov-score button[onclick^="setScore"]').forEach(function(b){
    var bn=parseInt(b.textContent);
    b.style.background=bn===n?'var(--bl)':'var(--bg3)';
    b.style.color=bn===n?'#fff':'var(--tx)';
  });
}
function applyFormula(rawPoint){
  try{
    var formula=DB.scoreFormula||'x';
    var result=Function('x','return ('+formula+')')(rawPoint);
    return Math.round(result*10)/10;
  }catch(e){return rawPoint;}
}
function saveScore(){
  if(!can('sc')){toast('Yetki yok','err');return;}
  var rawPoint=parseInt((document.getElementById('sc-point')||{value:0}).value)||0;
  var note=(document.getElementById('sc-note')||{value:''}).value.trim();
  if(rawPoint<1||rawPoint>10){toast('Puan 1-10 arasında olmalı','err');return;}
  var wo=DB.workOrders.find(function(w){return w.id===SCORE_WO_ID;});
  if(!wo){toast('İş bulunamadı','err');return;}
  if(!DB.scores)DB.scores={};
  var finalPoint=applyFormula(rawPoint);
  // Sorumlu teknisyen
  DB.scores[SCORE_WO_ID]={techId:wo.techId,point:finalPoint,rawPoint:rawPoint,note:note,by:U?U.name:'',ts:nowStr()};
  // Yardımcı teknisyenler - yarı puan
  if(wo.helperIds&&wo.helperIds.length>0){
    wo.helperIds.forEach(function(hid){
      var helperPoint=Math.round(applyFormula(rawPoint)/2*10)/10;
      DB.scores[SCORE_WO_ID+'_h_'+hid]={techId:hid,point:helperPoint,rawPoint:rawPoint,note:'(Yardımcı) '+note,by:U?U.name:'',ts:nowStr(),isHelper:true,mainWoId:SCORE_WO_ID};
    });
  }
  addLog('Puan Verildi',wo.id+' — '+rawPoint+' (formül:'+finalPoint+')','',wo.techId);
  dbSave(); MODAL_SCORE=false; SCORE_WO_ID=null;
  toast(rawPoint+' → '+finalPoint+' puan kaydedildi ✓'); renderModals(); renderPage();
}
function saveScoreFormula(){
  var f=(document.getElementById('sc-formula')||{value:'x'}).value.trim()||'x';
  try{Function('x','return ('+f+')')(5);}catch(e){toast('Formül hatalı: '+e.message,'err');return;}
  if(!DB)DB={};
  DB.scoreFormula=f;
  dbSave();toast('Formül kaydedildi: '+f+' ✓');renderPage();
}

    if(!chs.length){
      mainH=headerH+firebaseH
        +'<div style="text-align:center;padding:40px;background:var(--bg2);border:1px solid var(--bd);border-radius:12px">'
          +'<div style="font-size:40px;margin-bottom:10px">📡</div>'
          +'<div style="font-size:14px;font-weight:700;margin-bottom:6px">Bu ekipmandan henüz veri yok</div>'
          +'<div style="font-size:12px;color:var(--mt);line-height:1.7">'
            +'ESP32\'yi yukarıdaki URL\'e POST göndererek başlatın.<br>'
            +'Örnek: <code style="background:var(--bg3);padding:2px 6px;border-radius:4px">{"v": 25.4, "ts": "2026-06-01T12:30:00"}</code>'
          +'</div>'
          +(can('s')?'<div style="margin-top:14px"><button class="btn bpri bsm" onclick="_setSensorEq(\''+selEq.id+'\')">⚙ Sensör Kanal Tanımla</button></div>':'')
        +'</div>';
    } else {
      // Kanal grafik kartları
      var chCardsH = chs.map(function(ch){
        var d   = eqData[ch];
        var hist= (d.history||[]).slice(-60);
        var last= hist.length?hist[hist.length-1]:null;
        var val = last!==null?last.v:'—';
        var unit= d.unit||'';
        var canvasId='sc-'+selEq.id+'-'+ch;

        function chkT(v,op,thr){
          if(v===null||v===undefined||thr===undefined||isNaN(thr))return false;
          return op==='gt'?v>thr:op==='lt'?v<thr:op==='gte'?v>=thr:op==='lte'?v<=thr:false;
        }
        var isCrit = last&&chkT(last.v,d.critOp,d.critThreshold);
        var isWarn = last&&!isCrit&&chkT(last.v,d.warnOp,d.warnThreshold);
        var col    = isCrit?'#ef4444':isWarn?'#f59e0b':'#10b981';
        var brdCol = isCrit?'rgba(239,68,68,.4)':isWarn?'rgba(245,158,11,.3)':'var(--bdl)';

        var thrTagsH='';
        if(!isNaN(d.warnThreshold))thrTagsH+='<span style="background:rgba(245,158,11,.1);color:var(--orl);border:1px solid rgba(245,158,11,.3);border-radius:5px;padding:1px 7px;font-size:10px;font-weight:700">⚠ '+(THRESHOLD_TYPES[d.warnOp]||{sym:'>'}).sym+' '+d.warnThreshold+' '+unit+'</span> ';
        if(!isNaN(d.critThreshold))thrTagsH+='<span style="background:rgba(239,68,68,.1);color:var(--rdl);border:1px solid rgba(239,68,68,.3);border-radius:5px;padding:1px 7px;font-size:10px;font-weight:700">🔴 '+(THRESHOLD_TYPES[d.critOp]||{sym:'>'}).sym+' '+d.critThreshold+' '+unit+'</span>';

        return '<div style="background:var(--bg2);border:1px solid '+brdCol+';border-radius:12px;padding:16px;margin-bottom:14px">'
          +'<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px">'
            +'<div style="flex:1">'
              +'<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">'
                +'<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--mt)">'+esc(ch)+'</div>'
                +(isCrit?'<span style="background:var(--rdl);color:#fff;border-radius:5px;padding:1px 7px;font-size:10px;font-weight:700">KRİTİK</span>'
                  :isWarn?'<span style="background:var(--orl);color:#fff;border-radius:5px;padding:1px 7px;font-size:10px;font-weight:700">UYARI</span>'
                  :'<span style="background:rgba(16,185,129,.12);color:var(--gnl);border-radius:5px;padding:1px 7px;font-size:10px;font-weight:700">NORMAL</span>')
              +'</div>'
              +'<div style="font-size:32px;font-weight:900;color:'+col+';line-height:1">'+val
                +'<span style="font-size:14px;font-weight:400;color:var(--mt);margin-left:4px">'+unit+'</span>'
              +'</div>'
              +(last?'<div style="font-size:10px;color:var(--mt);margin-top:3px">🕐 '+esc(last.ts.slice(0,16).replace('T',' '))+'</div>':'')
            +'</div>'
            +'<div style="text-align:right">'
              +(thrTagsH?'<div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end;margin-bottom:8px">'+thrTagsH+'</div>':'')
              +(can('s')?'<button class="btn bghs bxs" onclick="_setSensorEq(\''+selEq.id+'\',\''+ch+'\')">✏ Eşik</button>':'')
            +'</div>'
          +'</div>'
          // İstatistikler (min/max/ort)
          +(hist.length>1?(function(){
            var vals=hist.map(function(h){return h.v;});
            var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals);
            var avg=(vals.reduce(function(a,b){return a+b;},0)/vals.length).toFixed(1);
            return '<div style="display:flex;gap:16px;margin-bottom:12px;font-size:11px;color:var(--mt)">'
              +'<div>Min: <strong style="color:var(--tx)">'+mn.toFixed(1)+'</strong> '+unit+'</div>'
              +'<div>Ort: <strong style="color:var(--tx)">'+avg+'</strong> '+unit+'</div>'
              +'<div>Max: <strong style="color:var(--tx)">'+mx.toFixed(1)+'</strong> '+unit+'</div>'
              +'<div style="margin-left:auto;color:var(--mt)">Son '+hist.length+' okuma</div>'
            +'</div>';
          })():'')
          +'<div style="position:relative;height:160px"><canvas id="'+canvasId+'"></canvas></div>'
        +'</div>';
      }).join('');

      mainH = headerH + firebaseH + chCardsH;
    }

    // Alarm geçmişi (seçili ekipman)
    var eqAlerts = alerts.filter(function(a){return a.eqId===selEq.id;}).slice(0,10);
    if(eqAlerts.length){
      mainH+='<div style="background:var(--bg2);border:1px solid var(--bdl);border-radius:12px;padding:16px;margin-top:14px">'
        +'<div style="font-size:13px;font-weight:700;margin-bottom:12px;color:var(--tx)">🚨 Bu Ekipmanın Alarm Geçmişi</div>'
        +eqAlerts.map(function(a){
          var isAct=a.status==='active';
          return '<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)">'
            +'<div style="width:8px;height:8px;border-radius:50%;flex-shrink:0;background:'+(isAct?'var(--rdl)':'var(--gnl)')+'"></div>'
            +'<div style="flex:1">'
              +'<div style="font-size:12px;font-weight:600">'+esc(a.ch||a.msg||'Alarm')+'</div>'
              +'<div style="font-size:10px;color:var(--mt)">'+esc((a.ts||'').slice(0,16).replace('T',' '))+(a.val!==undefined?' · '+a.val+' '+(a.unit||''):'')+'</div>'
            +'</div>'
            +(isAct&&can('w')?'<button class="btn bghs bxs" onclick="_resolveAlert(\''+a.id+'\')">✓ Çöz</button>':'')
            +'<span style="font-size:10px;font-weight:700;color:'+(isAct?'var(--rdl)':'var(--gnl)')+'">'+( isAct?'AKTİF':'ÇÖZÜLDÜ')+'</span>'
          +'</div>';
        }).join('')
      +'</div>';
    }
  }

  // ── Alarm bildirim kartı ───────────────────────────────
  var notifyH = can('s')
    ?'<div style="background:var(--bg2);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">'
      +'<div style="display:flex;align-items:center;gap:10px">'
        +'<span style="font-size:20px">'+(notify.enabled?'🔔':'🔕')+'</span>'
        +'<div>'
          +'<div style="font-size:12px;font-weight:700">'+(notify.enabled?'Mail Bildirimi Aktif':'Mail Bildirimi Kapalı')+'</div>'
          +'<div style="font-size:10px;color:var(--mt)">'+(notify.enabled&&notify.email?notify.email:'EmailJS ile alarm bildirimi')+'</div>'
        +'</div>'
      +'</div>'
      +'<div style="display:flex;gap:6px">'
        +'<button class="btn bghs bxs" onclick="openAlarmNotifySettings()">⚙ Ayarla</button>'
        +(notify.enabled
          ?'<button class="btn bdng bxs" onclick="toggleAlarmNotify(false)">🔕 Kapat</button>'
          :'<button class="btn bsuc bxs" onclick="toggleAlarmNotify(true)">🔔 Aç</button>')
      +'</div>'
    +'</div>'
    :'';

  // ── Grafik render (setTimeout ile DOM'dan sonra) ───────
  setTimeout(function(){
    if(!selEq)return;
    var eqData2=sdata[selEq.id]||{};
    Object.keys(eqData2).forEach(function(ch){
      var d=eqData2[ch];
      var hist=(d.history||[]).slice(-60);
      if(hist.length<2)return;
      var canvas=document.getElementById('sc-'+selEq.id+'-'+ch);
      if(!canvas)return;
      if(canvas._chart){canvas._chart.destroy();canvas._chart=null;}

      var labels=hist.map(function(h){return (h.ts||'').slice(11,16);});
      var vals  =hist.map(function(h){return h.v;});
      var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals);
      var pad=(mx-mn)*0.2||1;

      function chkT2(v,op,thr){if(v===null||thr===undefined||isNaN(thr))return false;return op==='gt'?v>thr:op==='lt'?v<thr:op==='gte'?v>=thr:v<=thr;}
      var lastV=vals[vals.length-1];
      var isCrit2=chkT2(lastV,d.critOp,d.critThreshold);
      var isWarn2=chkT2(lastV,d.warnOp,d.warnThreshold);
      var lc=isCrit2?'#ef4444':isWarn2?'#f59e0b':'#10b981';
      var lcA=lc.replace('#','rgba(').split('').join(''); // fallback

      var pointColors=vals.map(function(v){
        return chkT2(v,d.critOp,d.critThreshold)?'#ef4444':chkT2(v,d.warnOp,d.warnThreshold)?'#f59e0b':'#10b981';
      });

      var annotations={};
      if(!isNaN(d.warnThreshold)&&d.warnThreshold!==undefined)
        annotations.warn={type:'line',yMin:d.warnThreshold,yMax:d.warnThreshold,borderColor:'rgba(245,158,11,.8)',borderWidth:1.5,borderDash:[5,3],label:{display:true,content:'⚠ '+d.warnThreshold+(d.unit?' '+d.unit:''),backgroundColor:'rgba(245,158,11,.85)',color:'#fff',font:{size:10},position:'start',padding:{x:6,y:3}}};
      if(!isNaN(d.critThreshold)&&d.critThreshold!==undefined)
        annotations.crit={type:'line',yMin:d.critThreshold,yMax:d.critThreshold,borderColor:'rgba(239,68,68,.8)',borderWidth:1.5,borderDash:[5,3],label:{display:true,content:'🔴 '+d.critThreshold+(d.unit?' '+d.unit:''),backgroundColor:'rgba(239,68,68,.85)',color:'#fff',font:{size:10},position:'start',padding:{x:6,y:3}}};

      canvas._chart=new Chart(canvas,{
        type:'line',
        data:{labels:labels,datasets:[{
          label:ch+(d.unit?' ('+d.unit+')':''),
          data:vals,
          borderColor:lc,
          backgroundColor:'transparent',
          borderWidth:2,
          tension:0.35,
          pointBackgroundColor:pointColors,
          pointRadius:vals.length>25?0:3,
          pointHoverRadius:6,
          fill:false,
        }]},
        options:{
          responsive:true,maintainAspectRatio:false,
          interaction:{intersect:false,mode:'index'},
          plugins:{
            legend:{labels:{color:'#94a3b8',font:{size:11},boxWidth:12}},
            tooltip:{
              backgroundColor:'rgba(15,23,42,.96)',
              titleColor:'#e2e8f0',bodyColor:'#94a3b8',
              callbacks:{label:function(ctx){return ' '+ctx.parsed.y+(d.unit?' '+d.unit:'');}}
            },
            annotation:{annotations:annotations},
          },
          scales:{
            x:{ticks:{color:'#64748b',maxRotation:0,maxTicksLimit:10,font:{size:10}},grid:{color:'rgba(255,255,255,.04)'},border:{color:'rgba(255,255,255,.08)'}},
            y:{min:mn-pad,max:mx+pad,ticks:{color:'#64748b',font:{size:10},callback:function(v){return v+(d.unit?' '+d.unit:'');}},grid:{color:'rgba(255,255,255,.04)'},border:{color:'rgba(255,255,255,.08)'}},
          }
        }
      });
    });
  },100);

  return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px">'
    +'<div style="font-size:20px;font-weight:800">📡 Kestirimci Bakım</div>'
    +notifyH
  +'</div>'
  +'<div style="display:flex;gap:16px;align-items:flex-start">'
    // Sol: ekipman listesi
    +'<div style="width:220px;flex-shrink:0">'
      +'<div style="font-size:11px;font-weight:700;color:var(--mt);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px">Ekipmanlar ('+eqs.length+')</div>'
      +eqListH
      +(can('s')?'<div style="margin-top:8px"><button class="btn bghs bsm" style="width:100%;font-size:11px" onclick="showAPIGuide()">📖 API Rehberi</button></div>':'')
    +'</div>'
    // Sağ: seçili ekipman detayı
    +'<div style="flex:1;min-width:0">'+mainH+'</div>'
  +'</div>';
}

function _resolveAlert(id){
  DB.sensorAlerts=(DB.sensorAlerts||[]).map(function(a){
    return a.id===id?Object.assign({},a,{status:'resolved',resolvedAt:nowStr(),resolvedBy:U?U.name:''}):a;
  });
  dbSave();toast('Alarm çözüldü ✓');renderPage();
}

function showESP32Code(){
  var FIREBASE = 'https://huseyinbakim-default-rtdb.europe-west1.firebasedatabase.app';
  var lines=[
    '#include <WiFi.h>',
    '#include <HTTPClient.h>',
    '',
    'const char* SSID     = "WIFI_ADINIZ";',
    'const char* PASSWORD = "WIFI_SIFRENIZ";',
    'const char* FB_URL   = "'+FIREBASE+'";',
    'const char* EQ_ID    = "ekipman-id-buraya";  // Ekipmanlar sekmesinden kopyalayin',
    '',
    '#include <OneWire.h>',
    '#include <DallasTemperature.h>',
    '#define TEMP_PIN 4       // DS18B20 data pini',
    'OneWire ow(TEMP_PIN);',
    'DallasTemperature sensors(&ow);',
    '',
    '// NTP - zaman damgasi icin',
    '#include <time.h>',
    '',
    'void setup(){',
    '  Serial.begin(115200);',
    '  sensors.begin();',
    '  WiFi.begin(SSID, PASSWORD);',
    '  while(WiFi.status()!=WL_CONNECTED){delay(500);Serial.print(".");}',
    '  Serial.println("\\nWiFi OK: "+WiFi.localIP().toString());',
    '  configTime(10800,0,"pool.ntp.org");  // UTC+3 Turkiye',
    '}',
    '',
    'String getISO(){',
    '  struct tm t; getLocalTime(&t);',
    '  char buf[25];',
    '  strftime(buf,sizeof(buf),"%Y-%m-%dT%H:%M:%S",&t);',
    '  return String(buf);',
    '}',
    '',
    'void sendSensor(String channel, float value, String unit){',
    '  if(WiFi.status()!=WL_CONNECTED)return;',
    '  HTTPClient http;',
    '  // History push (Firebase POST = yeni kayit)',
    '  String url = String(FB_URL)+"/sensorData/"+EQ_ID+"/"+channel+"/history.json";',
    '  http.begin(url);',
    '  http.addHeader("Content-Type","application/json");',
    '  String body = "{\\"v\\":"+String(value,2)+",\\"ts\\":\\""+getISO()+"\\"}"  ;',
    '  int code = http.POST(body);',
    '  Serial.println(channel+"="+String(value)+" HTTP:"+String(code));',
    '  http.end();',
    '  // Unit bilgisi (bir kez gondermek yeterli ama her seferinde uzerine yazar)',
    '  HTTPClient http2;',
    '  http2.begin(String(FB_URL)+"/sensorData/"+EQ_ID+"/"+channel+"/unit.json");',
    '  http2.addHeader("Content-Type","application/json");',
    '  http2.PUT("\\""+unit+"\\"");',
    '  http2.end();',
    '}',
    '',
    'void loop(){',
    '  sensors.requestTemperatures();',
    '  float temp = sensors.getTempCByIndex(0);',
    '  if(temp != DEVICE_DISCONNECTED_C){',
    '    sendSensor("sicaklik", temp, "C");',
    '  }',
    '  delay(30000);  // 30 saniyede bir',
    '}',
  ];
  var code = lines.join('\n');
  var modal=document.createElement('div');
  modal.className='ov';
  modal.style.zIndex='9999';
  modal.innerHTML='<div class="md mdlg"><div class="mdh"><div class="mdt">📋 ESP32-S3 Arduino Kodu</div>'
    +'<button class="mdc" onclick="this.closest(\'.ov\').remove()">✕</button></div>'
    +'<div style="background:var(--bg0);border-radius:8px;padding:14px;overflow-x:auto;max-height:60vh;overflow-y:auto;margin-bottom:12px">'
    +'<pre id="esp-code" style="margin:0;font-size:12px;line-height:1.6;color:var(--sub)">'+code+'</pre></div>'
    +'<button class="btn bpri bsm" onclick="navigator.clipboard.writeText(document.getElementById(\'esp-code\').textContent).then(function(){toast(\'Kopyalandı ✓\')})">📋 Kopyala</button>'
    +'</div>';
  document.body.appendChild(modal);
}

    +'<button class="btn bsuc" onclick="saveSensorConfig()">Kaydet</button>'

function saveSensorConfig(){
  var eqId=(document.getElementById('sc-eq')||{value:''}).value;
  var ch=(document.getElementById('sc-ch')||{value:''}).value.trim().toLowerCase().replace(/\s+/g,'_');
  var unit=(document.getElementById('sc-unit')||{value:''}).value.trim();
  var wOp=(document.getElementById('sc-wop')||{value:'gt'}).value;
  var wT=parseFloat((document.getElementById('sc-wt')||{value:''}).value);
  var cOp=(document.getElementById('sc-cop')||{value:'gt'}).value;
  var cT=parseFloat((document.getElementById('sc-ct')||{value:''}).value);
  if(!eqId||!ch){toast('Ekipman ve kanal zorunlu','err');return;}
  if(!DB.sensorData)DB.sensorData={};
  if(!DB.sensorData[eqId])DB.sensorData[eqId]={};
  if(!DB.sensorData[eqId][ch])DB.sensorData[eqId][ch]={history:[]};
  var cfg=DB.sensorData[eqId][ch];
  if(unit)cfg.unit=unit;
  if(!isNaN(wT)){cfg.warnThreshold=wT;cfg.warnOp=wOp;}
  if(!isNaN(cT)){cfg.critThreshold=cT;cfg.critOp=cOp;}
  dbSave();
  var el=document.getElementById('ov-sensor-cfg');if(el)el.remove();
  toast('Eşikler kaydedildi ✓');renderPage();
}

function energyTypeChange(val){
  var e=ENERGY_TYPES[val];
  if(e){
    var u=document.getElementById('en-unit-lbl');
    if(u)u.textContent=e.unit;
    var u2=document.getElementById('en-unit-lbl2');
    if(u2)u2.textContent=e.unit;
  }
  calcEnergyCost();
}
function calcEnergyCost(){
  var val  = parseFloat((document.getElementById('en-val')     ||{value:''}).value)||0;
  var uprc = parseFloat((document.getElementById('en-unitprice')||{value:''}).value)||0;
  var cost = val*uprc;
  var costEl = document.getElementById('en-cost');
  if(costEl) costEl.value = cost>0 ? cost.toFixed(2) : '';
}
function saveEnergyLog(){
  var type=(document.getElementById('en-type')||{value:''}).value;
  var date=(document.getElementById('en-date')||{value:''}).value;
  var val =parseFloat((document.getElementById('en-val')||{value:''}).value);
  var unitprice=parseFloat((document.getElementById('en-unitprice')||{value:''}).value)||0;
  var cost=parseFloat((document.getElementById('en-cost')||{value:''}).value)||(val*unitprice);
  var ref =(document.getElementById('en-ref')||{value:''}).value.trim();
  var note=(document.getElementById('en-note')||{value:''}).value.trim();
  if(!type){toast('Enerji türü seçin','err');return;}
  if(!date){toast('Tarih girin','err');return;}
  if(isNaN(val)||val<0){toast('Geçerli miktar girin','err');return;}
  var log={
    id:       ENERGY_EDIT?ENERGY_EDIT.id:'EN-'+uid(),
    type:     type, date: date, val: val,
    unitprice:unitprice, cost: cost, ref: ref, note: note,
    by:    U?U.name:'', ts: nowStr(),
  };
  if(!DB.energyLogs)DB.energyLogs=[];
  if(ENERGY_EDIT)DB.energyLogs=DB.energyLogs.map(function(l){return l.id===log.id?log:l;});
  else DB.energyLogs.unshift(log);
  ENERGY_FLT_YEAR=date.slice(0,4);
  addLog('Enerji Kaydı '+(ENERGY_EDIT?'Güncellendi':'Eklendi'),(ENERGY_TYPES[type]||{lbl:type}).lbl+' '+val,'' ,date);
  dbSave();MODAL_ENERGY=false;ENERGY_EDIT=null;
  toast('Kaydedildi ✓');renderModals();renderPage();
}

  var months    = ['01','02','03','04','05','06','07','08','09','10','11','12'];
  var monthNames= ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
  var mShort    = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];

  var yELogs = eLogs.filter(function(l){return (l.date||'').startsWith(SET_FLT_YEAR);});
  var yProds = prods.filter(function(p){return (p.date||'').startsWith(SET_FLT_YEAR);});
  var activeETypes = Object.keys(ENERGY_TYPES).filter(function(et){
    return yELogs.some(function(l){return l.type===et;});
  });

  // ── Üretim birimi (ton, adet, kg, batch vb.)
  var prodUnit = targets.prodUnit || 'kg';
  var setUnits = {};
  activeETypes.forEach(function(et){
    setUnits[et] = ENERGY_TYPES[et].unit + '/' + prodUnit;
  });

  // ── Aylık veriler
  var tableData = months.map(function(m, mi){
    var mStr = SET_FLT_YEAR + '-' + m;
    var mELogs = yELogs.filter(function(l){return (l.date||'').startsWith(mStr);});
    var mProds = yProds.filter(function(p){return (p.date||'').startsWith(mStr);});
    var totalProd = mProds.reduce(function(a,p){return a+(parseFloat(p.val)||0);}, 0);
    var energyByType = {};
    activeETypes.forEach(function(et){
      energyByType[et] = mELogs.filter(function(l){return l.type===et;})
        .reduce(function(a,l){return a+(parseFloat(l.val)||0);}, 0);
    });
    var hasProd  = totalProd > 0;
    var hasEnergy= activeETypes.some(function(et){return energyByType[et]>0;});
    return {
      m: m, mi: mi, mStr: mStr,
      prod: totalProd, energy: energyByType,
      hasProd: hasProd, hasData: hasProd && hasEnergy,
    };
  });

  // ── SET hedefleri
  var targetsH = '<div class="card" style="margin-bottom:14px">'
    +'<div class="cardt">🎯 SET Hedefleri <span style="font-size:10px;color:var(--mt);font-weight:400">— isteğe bağlı</span>'
    +(can('s')?'<button class="btn bghs bxs" onclick="openSETTargets()" style="margin-left:auto">Hedef Ayarla</button>':'')
    +'</div>'
    +'<div style="display:flex;gap:12px;flex-wrap:wrap">'
    +activeETypes.map(function(et){
      var e=ENERGY_TYPES[et];
      var tgt=targets[et];
      return '<div style="background:var(--bg3);border-radius:8px;padding:10px 14px;font-size:12px">'
        +'<div style="color:var(--mt);margin-bottom:3px">'+e.ico+' '+e.lbl+'</div>'
        +'<div style="font-weight:700;color:'+(tgt?'var(--bll)':'var(--mt)')+'">'+
          (tgt ? tgt+' '+setUnits[et] : 'Hedef yok') + '</div>'
      +'</div>';
    }).join('')
    +(activeETypes.length===0?'<div style="color:var(--mt);font-size:12px">Önce Enerji Takibi sayfasından enerji verisi girin.</div>':'')
    +'</div></div>';

  // ── Üretim girişi butonu
  var prodH = '<div class="card" style="margin-bottom:14px">'
    +'<div class="cardt">🏭 Aylık Üretim Miktarı ('+prodUnit+')'
    +(can('w')?'<button class="btn bpri bxs" onclick="openSETProdModal(null)" style="margin-left:auto">+ Üretim Gir</button>':'')
    +'</div>'
    +'<div style="display:flex;gap:8px;flex-wrap:wrap">'
    +months.map(function(m,mi){
      var mStr=SET_FLT_YEAR+'-'+m;
      var mProds=yProds.filter(function(p){return (p.date||'').startsWith(mStr);});
      var total=mProds.reduce(function(a,p){return a+(parseFloat(p.val)||0);},0);
      return '<div style="background:var(--bg'+(total>0?'2':'3)')+';border:1px solid var('+(total>0?'--bl':'--bd')+'20);border-radius:8px;padding:10px 12px;min-width:90px;text-align:center;cursor:pointer" onclick="openSETProdModal(\''+mStr+'\')">'
        +'<div style="font-size:11px;color:var(--mt);margin-bottom:3px">'+mShort[mi]+'</div>'
        +'<div style="font-size:16px;font-weight:800;color:'+(total>0?'var(--bll)':'var(--mt)')+'">'+( total>0?total.toLocaleString('tr'):'-')+'</div>'
        +'<div style="font-size:10px;color:var(--mt)">'+prodUnit+'</div>'
      +'</div>';
    }).join('')
    +'</div></div>';

  // ── SET Tablosu
  var tableRows = tableData.filter(function(d){return d.hasData||d.prod>0;});
  var tableH = '';
  if(activeETypes.length > 0){
    var thead='<thead><tr>'
      +'<th style="text-align:left;padding:10px 8px;font-size:11px;color:var(--mt);border-bottom:1px solid var(--bd)">Ay</th>'
      +'<th style="text-align:right;padding:10px 8px;font-size:11px;color:var(--mt);border-bottom:1px solid var(--bd)">Üretim ('+prodUnit+')</th>'
      +activeETypes.map(function(et){
        var e=ENERGY_TYPES[et];
        return '<th style="text-align:right;padding:10px 8px;font-size:11px;color:var(--mt);border-bottom:1px solid var(--bd)">'
          +e.ico+' '+e.lbl+'<br><span style="font-weight:400;font-size:9px;color:var(--sub)">('+e.unit+')</span></th>'
          +'<th style="text-align:right;padding:10px 8px;font-size:11px;color:'+e.col+';border-bottom:1px solid var(--bd)">SET<br><span style="font-weight:400;font-size:9px;color:var(--sub)">('+setUnits[et]+')</span></th>';
      }).join('')
    +'</tr></thead>';

    var tbody='<tbody>'+tableData.map(function(d){
      if(!d.prod && !activeETypes.some(function(et){return d.energy[et]>0;})) return '';
      var cells = activeETypes.map(function(et){
        var e=ENERGY_TYPES[et];
        var ev=d.energy[et]||0;
        var set=d.prod>0&&ev>0 ? (ev/d.prod) : null;
        var tgt=targets[et];
        var setColor='var(--tx)';
        if(set!==null&&tgt){setColor=set<=tgt?'var(--gnl)':'var(--rdl)';}
        return '<td style="padding:8px;text-align:right;font-size:12px">'+(ev>0?ev.toLocaleString('tr'):'-')+'</td>'
          +'<td style="padding:8px;text-align:right;font-size:12px;font-weight:700;color:'+(set!==null?setColor:'var(--mt)')+'">'
            +(set!==null?set.toFixed(3):d.prod>0&&ev===0?'—':'<span style="color:var(--mt);font-weight:400">veri yok</span>')
            +(set!==null&&tgt?(set<=tgt?' ✓':' ⚠'):'')
          +'</td>';
      }).join('');
      return '<tr style="border-bottom:1px solid var(--bd)">'
        +'<td style="padding:8px;font-size:12px;font-weight:600">'+monthNames[d.mi]+'</td>'
        +'<td style="padding:8px;text-align:right;font-size:12px;font-weight:700">'+(d.prod>0?d.prod.toLocaleString('tr'):'-')+'</td>'
        +cells
      +'</tr>';
    }).join('')+'</tbody>';

    // Yıllık toplam
    var tfootCells=activeETypes.map(function(et){
      var totalE=tableData.reduce(function(a,d){return a+(d.energy[et]||0);},0);
      var totalP=tableData.reduce(function(a,d){return a+d.prod;},0);
      var avgSET=totalP>0&&totalE>0?totalE/totalP:null;
      var e=ENERGY_TYPES[et];
      var tgt=targets[et];
      var sc=avgSET!==null&&tgt?(avgSET<=tgt?'var(--gnl)':'var(--rdl)'):'var(--bll)';
      return '<td style="padding:8px;text-align:right;font-size:12px;font-weight:700">'+(totalE>0?totalE.toLocaleString('tr'):'-')+'</td>'
        +'<td style="padding:8px;text-align:right;font-size:13px;font-weight:900;color:'+(avgSET!==null?sc:'var(--mt)')+'">'+(avgSET!==null?avgSET.toFixed(3):'-')+'</td>';
    }).join('');
    var totalProd=tableData.reduce(function(a,d){return a+d.prod;},0);
    var tfoot='<tfoot><tr style="border-top:2px solid var(--bd);background:var(--bg3)">'
      +'<td style="padding:8px;font-size:12px;font-weight:800">YIL TOPLAMI</td>'
      +'<td style="padding:8px;text-align:right;font-size:12px;font-weight:800">'+(totalProd>0?totalProd.toLocaleString('tr'):'-')+'</td>'
      +tfootCells
    +'</tr></tfoot>';

    tableH='<div class="card" style="overflow-x:auto">'
      +'<div class="cardt">'+SET_FLT_YEAR+' SET Analizi Tablosu'
      +'<span style="font-size:11px;color:var(--mt);font-weight:400;margin-left:8px">✓ = hedefe ulaşıldı &nbsp; ⚠ = hedef aşıldı</span></div>'
      +'<table style="width:100%;border-collapse:collapse">'+thead+tbody+tfoot+'</table>'
    +'</div>';
  }

  // ── Graf (SET trendi)
  var chartH='';
  if(activeETypes.length>0){
    chartH='<div class="card" style="margin-bottom:14px"><div class="cardt">'+SET_FLT_YEAR+' SET Trendi</div>'
      +'<div style="height:220px"><canvas id="ch-set"></canvas></div></div>';
  }

  setTimeout(function(){
    var cv=document.getElementById('ch-set');
    if(!cv||!activeETypes.length)return;
    if(cv._chart){cv._chart.destroy();cv._chart=null;}
    var datasets=[];
    activeETypes.forEach(function(et){
      var e=ENERGY_TYPES[et];
      var setVals=tableData.map(function(d){
        return d.prod>0&&(d.energy[et]||0)>0?(d.energy[et]/d.prod):null;
      });
      datasets.push({label:'SET '+e.lbl+' ('+setUnits[et]+')',data:setVals,borderColor:e.col,backgroundColor:'transparent',borderWidth:2,tension:0.3,pointRadius:4,spanGaps:true});
      var tgt=targets[et];
      if(tgt){
        datasets.push({label:'Hedef '+e.lbl,data:months.map(function(){return parseFloat(tgt);}),borderColor:e.col,borderDash:[5,3],borderWidth:1,pointRadius:0,fill:false,backgroundColor:'transparent'});
      }
    });
    cv._chart=new Chart(cv,{type:'line',data:{labels:mShort,datasets:datasets},
      options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
        plugins:{legend:{labels:{color:'#94a3b8',font:{size:10},boxWidth:12,padding:8}},
          tooltip:{backgroundColor:'rgba(15,23,42,.95)',callbacks:{label:function(ctx){return ' '+ctx.dataset.label+': '+(ctx.parsed.y!==null?ctx.parsed.y.toFixed(3):'-');}}}},
        scales:{x:{ticks:{color:'#64748b',font:{size:11}},grid:{color:'rgba(255,255,255,.04)'}},
          y:{ticks:{color:'#64748b',font:{size:10}},grid:{color:'rgba(255,255,255,.04)'},beginAtZero:true}}}});
  },100);

  return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px">'
    +'<div>'
      +'<div style="font-size:20px;font-weight:800">📐 SET — Spesifik Enerji Tüketimi</div>'
      +'<div style="font-size:12px;color:var(--mt);margin-top:3px">SET = Enerji Tüketimi ÷ Üretim Miktarı</div>'
    +'</div>'
    +'<select class="inp isml" onchange="SET_FLT_YEAR=this.value;renderPage()" style="width:90px">'+yearOpts+'</select>'
    +'</div>'
    +targetsH+prodH
    +(chartH?chartH:'')
    +(tableH?tableH:'<div class="card">'+emptyHTML('SET hesaplamak için önce Enerji Takibi ve Üretim verisi girin.')+'</div>');
}

var MODAL_SET_TARGETS=false;
function openSETTargets(){
  MODAL_SET_TARGETS=true;renderModals();
}
function tplSETTargets(){
  if(!MODAL_SET_TARGETS)return '';
  var t=DB.setTargets||{};
  var prodUnit=t.prodUnit||'kg';
  var activeETypes=Object.keys(ENERGY_TYPES).filter(function(et){
    return (DB.energyLogs||[]).some(function(l){return l.type===et;});
  });
  var fieldsH=activeETypes.map(function(et){
    var e=ENERGY_TYPES[et];
    return '<div class="fr"><label class="lbl">'+e.ico+' '+e.lbl+' Hedef SET ('+e.unit+'/'+prodUnit+')</label>'
      +'<input class="inp" type="number" id="st-'+et+'" value="'+(t[et]||'')+'" placeholder="Hedef değer girin" min="0" step="0.001"/></div>';
  }).join('');
  return '<div class="ov" id="ov-set-tgt"><div class="md" style="max-width:440px">'
    +'<div class="mdh"><div class="mdt">🎯 SET Hedeflerini Ayarla</div>'
    +'<button class="mdc" onclick="MODAL_SET_TARGETS=false;renderModals()">✕</button></div>'
    +'<div class="fr"><label class="lbl">Üretim Birimi</label>'
    +'<input class="inp" id="st-produnit" value="'+esc(prodUnit)+'" placeholder="kg, adet, batch, ton..."/></div>'
    +(fieldsH||'<div style="color:var(--mt);font-size:12px;padding:10px">Önce Enerji Takibi sayfasından enerji verisi girin.</div>')
    +'<div style="display:flex;gap:8px;justify-content:flex-end;padding-top:14px;border-top:1px solid var(--bd)">'
    +'<button class="btn bghs" onclick="MODAL_SET_TARGETS=false;renderModals()">İptal</button>'
    +'<button class="btn bsuc" onclick="saveSETTargets()">Kaydet</button>'
    +'</div></div></div>';
}
function saveSETTargets(){
  var t=DB.setTargets||{};
  var pu=(document.getElementById('st-produnit')||{value:'kg'}).value.trim()||'kg';
  t.prodUnit=pu;
  Object.keys(ENERGY_TYPES).forEach(function(et){
    var el=document.getElementById('st-'+et);
    if(el&&el.value!==''){t[et]=parseFloat(el.value)||0;}
    else delete t[et];
  });
  DB.setTargets=t;
  dbSave();MODAL_SET_TARGETS=false;toast('SET hedefleri kaydedildi ✓');renderModals();renderPage();
}

function openSETProdModal(dateStr){
  SET_PROD_EDIT=dateStr||null;
  MODAL_SET_PROD=true;renderModals();
}
function tplSETProdModal(){
  if(!MODAL_SET_PROD)return '';
  var prodUnit=(DB.setTargets||{}).prodUnit||'kg';
  var mStr=SET_PROD_EDIT||today().slice(0,7);
  var existing=(DB.setProduction||[]).filter(function(p){return (p.date||'').startsWith(mStr);});
  var curVal=existing.reduce(function(a,p){return a+(parseFloat(p.val)||0);},0);
  return '<div class="ov" id="ov-set-prod"><div class="md" style="max-width:400px">'
    +'<div class="mdh"><div class="mdt">🏭 Üretim Miktarı Gir</div>'
    +'<button class="mdc" onclick="MODAL_SET_PROD=false;renderModals()">✕</button></div>'
    +'<div class="fr"><label class="lbl">Dönem</label>'
    +'<input class="inp" type="month" id="sp-month" value="'+mStr+'"/></div>'
    +'<div class="fr"><label class="lbl">Üretim Miktarı ('+prodUnit+')'+(curVal>0?' — mevcut: '+curVal.toLocaleString('tr')+' '+prodUnit:'')+'</label>'
    +'<input class="inp" type="number" id="sp-val" value="'+(curVal||'')+'" placeholder="0" min="0" step="0.01"/></div>'
    +'<div class="fr"><label class="lbl">Not</label>'
    +'<input class="inp" id="sp-note" placeholder="Aylık üretim notu..."/></div>'
    +'<div style="display:flex;gap:8px;justify-content:flex-end;padding-top:14px;border-top:1px solid var(--bd)">'
    +'<button class="btn bghs" onclick="MODAL_SET_PROD=false;renderModals()">İptal</button>'
    +'<button class="btn bsuc" onclick="saveSETProd()">Kaydet</button>'
    +'</div></div></div>';
}
function saveSETProd(){
  var mStr=(document.getElementById('sp-month')||{value:''}).value;
  var val=parseFloat((document.getElementById('sp-val')||{value:''}).value)||0;
  var note=(document.getElementById('sp-note')||{value:''}).value.trim();
  if(!mStr){toast('Dönem seçin','err');return;}
  if(val<0){toast('Geçerli miktar girin','err');return;}
  if(!DB.setProduction)DB.setProduction=[];
  // Aynı ay varsa güncelle
  DB.setProduction=DB.setProduction.filter(function(p){return !(p.date||'').startsWith(mStr);});
  if(val>0)DB.setProduction.push({id:'SP-'+uid(),date:mStr+'-01',val:val,note:note,by:U?U.name:'',ts:nowStr()});
  SET_FLT_YEAR=mStr.slice(0,4);
  dbSave();MODAL_SET_PROD=false;
  toast('Üretim verisi kaydedildi ✓');renderModals();renderPage();
}


// BOOT
// Firebase başlat
fbInit();
// İlk render — Firebase gelmeden önce login ekranını göster
R();

// QR link ile gelindiyse (?eq=EQ-001)
qrCaptureTarget();
(function(){
  var urlParams = typeof URLSearchParams !== 'undefined'
    ? new URLSearchParams(window.location.search) : null;
  var qParam  = urlParams ? urlParams.get('eq') : null;
  var spParam = urlParams ? urlParams.get('sp') : null;
  var tabParam = urlParams ? (urlParams.get('tab') || urlParams.get('page')) : null;
  if(tabParam === 'wo' || tabParam === 'workorders' || tabParam === 'is-emri') QR_PENDING_TAB = 'workorders';
  if(qParam)  { window._pendingQR = qParam;  sessionStorage.setItem('pendingQR',  qParam); sessionStorage.setItem('pendingQRTab', QR_PENDING_TAB); }
  if(spParam) { window._pendingSP = spParam; sessionStorage.setItem('pendingSP', spParam); try{localStorage.setItem('pharma_sp_target',JSON.stringify({sp:spParam,ts:Date.now()}));}catch(e){} }
  // Önceki oturumdan kalan pending'leri de oku
  if(!qParam)  { var sq=sessionStorage.getItem('pendingQR');  if(sq)window._pendingQR=sq;  }
  var st=sessionStorage.getItem('pendingQRTab'); if(st) QR_PENDING_TAB = st;
  if(!spParam) { var ss=sessionStorage.getItem('pendingSP'); if(ss)window._pendingSP=ss; }
})();
R();
</script>
